version: "3"

# envtest runs a real, ephemeral kube-apiserver backed by etcd. It covers what a mock cannot:
# CRD admission against the actual generated schema, a live MutatingWebhookConfiguration
# actually calling back into a locally running weebo-si-webhook, the controller's status writes
# actually landing, and — for weebo-si-webhook's namespaceSelector suite and
# weebo-si-operator's RBAC suite, both of which `helm template` charts/weebo-si-operator for
# real rather than hand-writing a stand-in manifest — that the chart itself, not just the Rust,
# behaves as RFC 0002 documents. Those two suites need `helm` on PATH (mise already provides it
# — see `task helm:lint`).
#
# Binaries live under ENVTEST_DIR (default ~/.local/share/kubebuilder-envtest) and are
# downloaded once. Every envtest suite is behind its crate's `envtest` Cargo feature, so a plain
# `task test` / `cargo test` never needs the binaries.

vars:
  ENVTEST_K8S_VERSION: '{{ .ENVTEST_K8S_VERSION | default "1.32.0" }}'
  ENVTEST_DIR: '{{ .ENVTEST_DIR | default (printf "%s/.local/share/kubebuilder-envtest" .HOME) }}'

tasks:
  setup:
    desc: "Download the kube-apiserver and etcd binaries used by the envtest suites"
    silent: true
    status:
      - test -x "{{ .ENVTEST_DIR }}/kube-apiserver"
      - test -x "{{ .ENVTEST_DIR }}/etcd"
    cmds:
      - echo "Fetching envtest binaries for Kubernetes {{ .ENVTEST_K8S_VERSION }}"
      - mkdir -p "{{ .ENVTEST_DIR }}"
      # Checksum-verified before extraction. For the default version the SHA-512 is pinned here
      # (the same value .github/workflows/envtest.yaml pins); for any other ENVTEST_K8S_VERSION it
      # falls back to the `.sha512` file controller-tools publishes next to each tarball — which
      # catches a truncated or swapped download, though not a compromised release.
      - |
        set -eu
        url="https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v{{ .ENVTEST_K8S_VERSION }}/envtest-v{{ .ENVTEST_K8S_VERSION }}-linux-amd64.tar.gz"
        curl -fsSL -o /tmp/envtest.tar.gz "$url"
        if [ "{{ .ENVTEST_K8S_VERSION }}" = "1.32.0" ]; then
          want="3a9584af30d041c42893d8f7a860aa434976d4aee479cf2e9a50a9e5677dcc83d3012a2146a6feb5b2e95a7b3c6f657ae9c591745981262da8b06e4b61dcdf17"
        else
          want="$(curl -fsSL "$url.sha512" | cut -d' ' -f1)"
        fi
        echo "$want  /tmp/envtest.tar.gz" | sha512sum -c -
      - tar xzf /tmp/envtest.tar.gz -C "{{ .ENVTEST_DIR }}" --strip-components=2
      - rm -f /tmp/envtest.tar.gz
      - echo "envtest binaries installed in {{ .ENVTEST_DIR }}"
  conformance:
    desc: "RFC 0009's dialect conformance suite — the gateway behind a real Traefik, over a real apiserver"
    silent: true
    deps:
      - setup
    env:
      KUBEBUILDER_ASSETS: "{{ .ENVTEST_DIR }}"
    cmds:
      # Needs `traefik` on PATH (mise provides it) *and* the envtest binaries above. The suite
      # skips itself rather than failing when either is missing, which is what lets
      # `cargo test --workspace --all-features` stay green on a machine with neither — but a
      # suite that only ever skips is a suite nobody runs, so this task exists to run it on
      # purpose.
      - cargo test -p endpoint-gateway --features conformance --test conformance -- --test-threads=1 --nocapture

  perf:
    desc: "Measure what the endpoint-auth gate costs on a release build: the conformance suite's cost matrix (needs traefik) and the gateway's in-process cost test — what .github/workflows/perf.yaml runs"
    silent: true
    deps:
      - setup
    env:
      KUBEBUILDER_ASSETS: "{{ .ENVTEST_DIR }}"
    cmds:
      # Release, unlike `conformance` above: these are the numbers a production gateway shows,
      # where the debug build's are ten times slower and only good as a margin to the budget.
      - cargo test --release -p endpoint-gateway --features conformance --test conformance -- --test-threads=1 --nocapture
      - cargo test --release -p endpoint-gateway --bin endpoint-gateway cost -- --ignored --nocapture --test-threads=1

  clean:
    desc: "Remove the downloaded envtest binaries"
    silent: true
    cmds:
      - rm -rf "{{ .ENVTEST_DIR }}"
  run:
    desc: "Run every envtest suite against a real ephemeral kube-apiserver"
    silent: true
    deps:
      - setup
    env:
      KUBEBUILDER_ASSETS: "{{ .ENVTEST_DIR }}"
    cmds:
      - echo "Running the envtest suites"
      # Serialised: each test owns an apiserver, and running several at once only multiplies
      # the memory footprint for no wall-clock gain.
      - cargo test --workspace --features envtest --test envtest -- --test-threads=1
      # RFC 0006's suite is its own target rather than more cases in weebo-si-runtime's
      # `envtest`: it installs a KubeArmorPolicy CRD fixture into the apiserver, and a suite
      # that installs a CRD should not share one with a suite that assumes a bare cluster.
      - cargo test --workspace --features envtest --test kubearmor_envtest -- --test-threads=1
      # RFC 0007's suite is likewise its own target: it is specifically about a store that
      # watches every ConfigMap and Secret in the cluster, and `envtest` above assumes a bare one.
      - cargo test --workspace --features envtest --test registry_envtest -- --test-threads=1
      # RFC 0009's suite is its own target for the same reason: it registers two admission rules
      # over `ingresses`, a core resource every other suite's apiserver is assumed to be free of.
      - cargo test --workspace --features envtest --test endpoint_auth_envtest -- --test-threads=1
      # RFC 0009's `OpenShiftRoute` dialect, which installs a `Route` CRD and puts its admission
      # rules on `route.openshift.io/v1` instead. It proves the *admission* half — the retarget,
      # the pin on `spec.to`, and the reattach after DevWorkspace Operator regenerates the object
      # — and nothing whatever about an OpenShift router, which is a separate line in that RFC's
      # plan and stays open. Run here rather than in `task test:openshift`: that tier is the
      # deferred, unvalidated one, and these assertions are neither.
      - cargo test --workspace --features envtest --test openshift_envtest -- --test-threads=1
