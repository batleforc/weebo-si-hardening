version: "3"

# The documentation site (site/, RFC 0012): a Fumadocs site on @weebo/operator-docs. The CRD
# reference under site/content/docs/crds/ and site/public/crd-schemas/ is generated from the
# chart's CRDs and committed, like the CRDs themselves.

vars:
  SITE_DIR: "{{.ROOT_DIR}}/site"

tasks:
  deps:
    desc: "Install the documentation site's dependencies (npm ci in site/)"
    dir: "{{.SITE_DIR}}"
    cmds:
      - npm ci --no-audit --no-fund

  gen:
    desc: "Regenerate the site's CRD reference from charts/weebo-si-operator/crds/ (skipped, with a note, before `task docs:deps`)"
    dir: "{{.SITE_DIR}}"
    cmds:
      - |
        if [ ! -d node_modules ]; then
          echo "docs:gen skipped — run 'task docs:deps' once; CI checks the reference either way"
          exit 0
        fi
        npm run --silent gen:crds

  check:
    desc: "Fail if the site's CRD reference is stale against the chart's CRDs (run by task lint once site/ has its dependencies)"
    dir: "{{.SITE_DIR}}"
    cmds:
      - task: gen
      - git diff --exit-code -- content/docs/crds public/crd-schemas

  site:
    desc: "Serve the documentation site on http://localhost:3000"
    dir: "{{.SITE_DIR}}"
    cmds:
      - npm run dev

  build:
    desc: "Lint, type-check and statically export the documentation site into site/out/"
    dir: "{{.SITE_DIR}}"
    cmds:
      - npm run lint
      - npm run types:check
      - npm run build
