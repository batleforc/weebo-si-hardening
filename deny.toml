# cargo-deny configuration — driven by `task audit`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Any RUSTSEC advisory fails the audit. Exceptions go here with a comment saying why and
# what unblocks them — never as a silent entry.
yanked = "deny"
ignore = []

[licenses]
# Permissive only. These bricks ship inside images we redistribute, so a copyleft dependency
# is a legal decision, not a dependency decision — it needs a RFC, not an entry here.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # `webpki-roots`/`webpki-root-certs`: a data license over a root certificate bundle, not code.
  # Permissive, no copyleft or attribution obligation on redistribution — pulled in transitively
  # via `rustls-native-certs` (`kube-client`'s TLS stack).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates we never want pulled in, whatever the transitive path.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
