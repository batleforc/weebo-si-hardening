                                  - NotIn
                                  - Exists
                                  - DoesNotExist
                                  type: string
                                values:
                                  default: []
                                  description: The comparison values `operator` reads. Unused by `Exists`/`DoesNotExist`.
                                  items:
                                    type: string
                                  type: array
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                          matchLabels:
                            additionalProperties:
                              type: string
                            default: {}
                            description: Every key must be present with exactly this value.
                            type: object
                        type: object
                      onMissingTarget:
