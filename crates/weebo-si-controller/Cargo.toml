[package]
name = "weebo-si-controller"
version = "0.1.0"
description = "The reconcile loops: WeeboSiConfig status, one controller per reconcile feature, leader election"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing = { workspace = true }
# RFC 0012: Events and the retry policy.
weebo-kit-runtime = { workspace = true }
weebo-kit-domain = { workspace = true }
weebo-si-crd = { version = "0.1.0", path = "../weebo-si-crd" }
weebo-si-runtime = { version = "0.1.0", path = "../weebo-si-runtime" }
prometheus = { workspace = true }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis" }
weebo-si-image-policy = { version = "0.1.0", path = "../weebo-si-image-policy" }
kube = { workspace = true, features = ["client", "runtime"] }
k8s-openapi = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
# `config_changes`' poll.
tokio = { workspace = true }

[features]
# Opt-in tier that needs a real kube-apiserver (see `task envtest:setup`).
envtest = []

[dev-dependencies]
weebo-si-envtest-support = { version = "0.1.0", path = "../weebo-si-envtest-support" }
# The real kube adapters, so the envtest tier proves the provisioning half against an apiserver
# with the upstream CRDs installed rather than against a fake.
weebo-si-runtime = { version = "0.1.0", path = "../weebo-si-runtime" }
weebo-si-identity = { version = "0.1.0", path = "../weebo-si-identity", features = ["testing"] }
weebo-si-kubearmor-policy = { version = "0.1.0", path = "../weebo-si-kubearmor-policy", features = ["testing"] }
weebo-si-registry-config = { version = "0.1.0", path = "../weebo-si-registry-config", features = ["testing"] }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis", features = ["testing"] }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_yaml_bw = { workspace = true }

[lints]
workspace = true
