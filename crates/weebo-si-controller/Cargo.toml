[package]
name = "weebo-si-controller"
version = "0.1.0"
description = "The WeeboSiConfig reconcile loop: validate, and report status"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
weebo-si-crd = { version = "0.1.0", path = "../weebo-si-crd" }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis" }
weebo-si-network-profiles = { version = "0.1.0", path = "../weebo-si-network-profiles" }
weebo-si-kubearmor-policy = { version = "0.1.0", path = "../weebo-si-kubearmor-policy" }
kube = { workspace = true, features = ["client", "runtime"] }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
kube-leader-election = { workspace = true }

[features]
# Opt-in tier that needs a real kube-apiserver (see `task envtest:setup`).
envtest = []

[dev-dependencies]
weebo-si-envtest-support = { version = "0.1.0", path = "../weebo-si-envtest-support" }
weebo-si-kubearmor-policy = { version = "0.1.0", path = "../weebo-si-kubearmor-policy", features = ["testing"] }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis", features = ["testing"] }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
