[package]
name = "weebo-si-webhook"
version = "0.1.0"
description = "The dwoc-pin mutating admission webhook: AdmissionReview in, JSON Patch out"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
weebo-si-crd = { version = "0.1.0", path = "../weebo-si-crd" }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis" }
weebo-si-dwoc-pin = { version = "0.1.0", path = "../weebo-si-dwoc-pin" }
weebo-si-network-profiles = { version = "0.1.0", path = "../weebo-si-network-profiles" }
weebo-si-policy-guard = { version = "0.1.0", path = "../weebo-si-policy-guard" }
weebo-si-image-policy = { version = "0.1.0", path = "../weebo-si-image-policy" }
weebo-si-registry-config = { version = "0.1.0", path = "../weebo-si-registry-config" }
# RFC 0009's compiler, so that what admission accepts and what the gateway compiles are the *same*
# function rather than two that agree today: a rule list the webhook admits and the gateway then
# drops is a hole nobody sees. The crate is `serde` + `serde_yaml_bw` + `sha2` and nothing else,
# which is what makes depending on it from the operator cheap.
weebo-si-endpoint-auth = { version = "0.1.0", path = "../weebo-si-endpoint-auth" }
axum = { workspace = true }
kube = { workspace = true, features = ["admission", "client"] }
k8s-openapi = { workspace = true }
serde_json = { workspace = true }
json-patch = { workspace = true }
jsonptr = { workspace = true }
tokio = { workspace = true }
prometheus = { workspace = true }

[features]
# Opt-in tier that needs a real kube-apiserver (see `task envtest:setup`).
envtest = []

[dev-dependencies]
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis", features = ["testing"] }
weebo-si-runtime = { version = "0.1.0", path = "../weebo-si-runtime" }
weebo-si-envtest-support = { version = "0.1.0", path = "../weebo-si-envtest-support" }
kube = { workspace = true, features = ["client", "runtime", "admission", "rustls-tls", "ring"] }
k8s-openapi = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde_yaml_bw = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
