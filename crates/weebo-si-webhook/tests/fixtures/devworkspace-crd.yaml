# A minimal stand-in for DevWorkspace Operator's own `DevWorkspace` CRD, used only by the
# envtest suite. We do not own this CRD — envtest has no upstream Rust type for it and does not
# install the real DevWorkspace Operator — so this fixture declares only enough shape to prove
# the webhook's admission behaviour: `x-kubernetes-preserve-unknown-fields` on spec/status
# (we validate nothing beyond `type: object`, since only our own webhook cares about the
# attribute's contents) and a `status` subresource (so the suite can prove the mutating rule
# matches `devworkspaces` and not `devworkspaces/status`, per RFC 0002's *Webhook configuration*).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devworkspaces.controller.devfile.io
spec:
  group: controller.devfile.io
  names:
    kind: DevWorkspace
    listKind: DevWorkspaceList
    plural: devworkspaces
    singular: devworkspace
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
