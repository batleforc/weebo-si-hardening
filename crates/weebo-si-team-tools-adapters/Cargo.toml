[package]
name = "weebo-si-team-tools-adapters"
version = "0.1.0"
description = "team-tools' adapters: its template and object stores, the /scale writer, metrics and reconcile loop"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
weebo-si-team-tools = { version = "0.1.0", path = "../weebo-si-team-tools" }
weebo-si-crd = { version = "0.1.0", path = "../weebo-si-crd" }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis" }
weebo-si-runtime = { version = "0.1.0", path = "../weebo-si-runtime" }
kube = { workspace = true, features = ["client", "runtime"] }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[features]
# Opt-in tier that needs a real kube-apiserver (see `task envtest:setup`).
envtest = []

[dev-dependencies]
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis", features = ["testing"] }
weebo-si-team-tools = { version = "0.1.0", path = "../weebo-si-team-tools", features = ["testing"] }
weebo-si-envtest-support = { version = "0.1.0", path = "../weebo-si-envtest-support" }
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
