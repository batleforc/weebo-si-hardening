[package]
name = "weebo-si-network-profiles"
version = "0.1.0"
description = "The network-profiles feature: per-namespace and per-workspace NetworkPolicy baselines"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
weebo-si-crd = { version = "0.1.0", path = "../weebo-si-crd" }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis" }

[features]
# In-memory fakes for this crate's own ports, otherwise only built under `cfg(test)` — same
# pattern as weebo-si-chassis's own `testing` feature, for the day an adapter crate's tests want
# them as a dev-dependency.
testing = []

[dev-dependencies]
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
