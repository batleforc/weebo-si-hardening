# A minimal stand-in for DevWorkspace Operator's own `DevWorkspaceOperatorConfig` CRD — the
# catalogued target `dwoc-pin` pins workspaces to. Same reasoning as devworkspace-crd.yaml: we
# do not own this CRD, envtest does not install the real DevWorkspace Operator, and
# `KubeDwocStore` only ever checks whether an object of this shape exists — never its contents.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devworkspaceoperatorconfigs.controller.devfile.io
spec:
  group: controller.devfile.io
  names:
    kind: DevWorkspaceOperatorConfig
    listKind: DevWorkspaceOperatorConfigList
    plural: devworkspaceoperatorconfigs
    singular: devworkspaceoperatorconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
