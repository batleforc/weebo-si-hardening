# Argo CD's `Application`, trimmed to an opaque `spec`.
#
# Deliberately `x-kubernetes-preserve-unknown-fields` rather than a copy of upstream's schema:
# what this operator promises about an `Application` is the five fields RFC 0011's table names,
# and pinning the rest of Argo's schema here would make this suite fail on their releases rather
# than on our own bugs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: Application
    plural: applications
    singular: application
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
