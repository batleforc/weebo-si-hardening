# A stand-in for OpenShift's own `route.openshift.io/v1` `Route`, so RFC 0009's `OpenShiftRoute`
# dialect can be put through real admission on a real apiserver.
#
# Same reasoning as devworkspaceoperatorconfig-crd.yaml: we do not own this CRD and envtest is
# not OpenShift. What is deliberately *not* the same is how much schema it carries. The DWOC
# fixture preserves unknown fields wholesale because nothing ever reads its contents; this one is
# spelled out down to `spec.to.name`, because that field is the entire dialect — the mutation
# repoints it, the guard pins it, and a schema that quietly accepted anything there would let
# both tests pass while writing nothing.
#
# What this fixture cannot stand in for is an OpenShift *router*. Admission is a different fact
# from serving traffic, and RFC 0009's implementation plan keeps the two apart on purpose.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  names:
    kind: Route
    listKind: RouteList
    plural: routes
    singular: route
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [to]
              properties:
                host:
                  type: string
                path:
                  type: string
                to:
                  type: object
                  required: [name]
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    weight:
                      type: integer
                      format: int32
                port:
                  type: object
                  properties:
                    # `intstr` on the real CRD. A string here, because the only thing this suite
                    # does with it is read it back, and a union type would buy nothing but a
                    # reason for the fixture to disagree with itself.
                    targetPort:
                      type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
