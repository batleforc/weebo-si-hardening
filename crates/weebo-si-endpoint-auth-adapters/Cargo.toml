[package]
name = "weebo-si-endpoint-auth-adapters"
version = "0.1.0"
description = "endpoint-auth's adapters: the routing-object mutation and guard, and the reconcile sweep"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
weebo-si-endpoint-auth = { version = "0.1.0", path = "../weebo-si-endpoint-auth" }
weebo-si-policy-guard = { version = "0.1.0", path = "../weebo-si-policy-guard" }
# The structural namespace exclusions (`is_excluded_namespace`) every reconcile feature shares.
weebo-si-network-profiles = { version = "0.1.0", path = "../weebo-si-network-profiles" }
weebo-si-crd = { version = "0.1.0", path = "../weebo-si-crd" }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis" }
weebo-si-runtime = { version = "0.1.0", path = "../weebo-si-runtime" }
weebo-si-webhook = { version = "0.1.0", path = "../weebo-si-webhook" }
weebo-si-controller = { version = "0.1.0", path = "../weebo-si-controller" }
kube = { workspace = true, features = ["client", "runtime", "admission"] }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
prometheus = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
json-patch = { workspace = true }
jsonptr = { workspace = true }

[features]
# Opt-in tier that needs a real kube-apiserver (see `task envtest:setup`).
envtest = []

[dev-dependencies]
# The suites build the whole admission stack their routes run on: the shared caches and the
# capability snapshots `KubeConfigStore` needs.
weebo-si-network-profiles-adapters = { version = "0.1.0", path = "../weebo-si-network-profiles-adapters" }
weebo-si-kubearmor-policy-adapters = { version = "0.1.0", path = "../weebo-si-kubearmor-policy-adapters" }
axum-server = { workspace = true }
tempfile = { workspace = true }
weebo-si-chassis = { version = "0.1.0", path = "../weebo-si-chassis", features = ["testing"] }
weebo-si-endpoint-auth = { version = "0.1.0", path = "../weebo-si-endpoint-auth", features = ["testing"] }
weebo-si-envtest-support = { version = "0.1.0", path = "../weebo-si-envtest-support" }
kube = { workspace = true, features = ["client", "runtime", "admission", "rustls-tls", "ring"] }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde_yaml_bw = { workspace = true }

[lints]
workspace = true
