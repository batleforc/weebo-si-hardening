# A minimal stand-in for KubeArmor's own `KubeArmorPolicy` CRD, used only by the envtest suite.
# We do not own this CRD, and envtest does not install KubeArmor — so this fixture declares only
# the shape RFC 0006's adapters actually touch: a `spec` with `selector` and the five rule
# sections, every one of them `x-kubernetes-preserve-unknown-fields` because this project copies
# rule content verbatim and never parses it.
#
# What this fixture deliberately does NOT reproduce is KubeArmor's own validation. A suite
# running against it proves what the adapter *writes* and how it reads back — not that KubeArmor
# accepts it, which is the reconfirmation RFC 0006's *Unresolved questions* asks for against a
# real deployment.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubearmorpolicies.security.kubearmor.com
spec:
  group: security.kubearmor.com
  names:
    kind: KubeArmorPolicy
    listKind: KubeArmorPolicyList
    plural: kubearmorpolicies
    singular: kubearmorpolicy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
