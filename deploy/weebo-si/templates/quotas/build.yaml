# resource-quotas profile `build` (RFC 0014): the weebo-build team's default.
#
# A podman/buildah build inside a workspace runs in the workspace container's cgroup, so its
# memory counts against that container's limit — a Rust or Node image build needs headroom the
# standard profile does not give. Same zero on NodePort and LoadBalancer, for the same reason.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-build
  namespace: weebo-si-hardening-templates
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 16Gi
    limits.cpu: "24"
    limits.memory: 40Gi
    pods: "20"
    persistentvolumeclaims: "12"
    requests.storage: 200Gi
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits-build
  namespace: weebo-si-hardening-templates
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 256Mi }
      default: { cpu: "4", memory: 4Gi }
      max: { cpu: "12", memory: 24Gi }
