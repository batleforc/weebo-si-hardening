# endpoint-gateway chart values for weebo-si. docs/guides/weebo-si-standard.md, step 6.
#
#   helm upgrade --install endpoint-gateway oci://ghcr.io/batleforc/charts/endpoint-gateway \
#     --version 0.3.0 -n weebo-si-hardening -f deploy/weebo-si/values/endpoint-gateway.yaml
#
# On weebo-si: 2.argo/helm/che/main/templates/endpoint-gateway.yaml and its values. The OIDC
# client secret and the session keys come from OpenBao (mv/weebo-si-hardening/endpoint-gateway)
# through a SecretStore, never from this file.

image:
  repository: registry.pkg.weebo.poc/ghcr/batleforc/endpoint-gateway

# The gate fails closed: with no replica up, every workspace endpoint answers an error. Two on a
# single node still survive a rollout (maxUnavailable: 0) and a crash.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  className: traefik
  host: endpoint-auth.cde.dev.weebo.poc
  annotations:
    cert-manager.io/cluster-issuer: vault-issuer
  tls:
    enabled: true
    secretName: endpoint-gateway-tls

# The weebo.poc private CA, replicated by trust-manager.
extraCa:
  configMap: weebo.poc
  key: main-ca.crt

networkPolicy:
  enabled: true

config:
  # Authentik's per-application issuer for the endpoint-gateway application.
  issuer: https://auth.weebo.poc/application/o/endpoint-gateway/
  clientId: endpoint-gateway
  redirectUrl: https://endpoint-auth.cde.dev.weebo.poc/oidc/callback
  claims:
    # What Che derives its username from (CHE_OIDC_USERNAME__CLAIM). A different claim and every
    # owner check fails: everybody is locked out of their own endpoints.
    username: preferred_username
    groups: groups
  hosts:
    suffix: .cde.dev.weebo.poc
    exclude:
      - cde.dev.weebo.poc
      - endpoint-auth.cde.dev.weebo.poc
  bearer:
    # Tokens minted for this audience only. Without the audience mapper on the Authentik
    # provider, a token minted for any other weebo application would open workspace endpoints.
    audiences: [endpoint-gateway]
    serviceAccountToken: true
  # Observe at stage 6, Enforce at stage 7 — always in step with
  # spec.features.endpointAuth.gateway.enforcement.
  enforcement: Observe
