# Default values for weebo-si-operator.
# See docs/bricks/weebo-si-operator.md and RFC 0002 for the design behind every default here —
# in particular *why* the webhook and controller are two Deployments behind two ServiceAccounts,
# and why `certificates.provider` has no default that "just works": RFC 0002 has no self-signed
# fallback of its own, on purpose.

# This repo has no registry decision yet (see .github/workflows/brick.yaml) — replace both
# before installing.
image:
  repository: weebo-si-operator
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Creates a Namespace named `.Release.Namespace`, pre-labelled `hardening.weebo.io/exclude` so
# the operator's own namespace is never a target of its own webhook — see RFC 0002's
# *Self-deadlock*. Set to false if the namespace already exists and is managed elsewhere; the
# label must still be applied by hand in that case.
namespace:
  create: true
  extraLabels: {}

# `spec.features.dwocPin` etc. are configured through a `WeeboSiConfig` object, not through this
# chart — see RFC 0002's *Rollout*. This chart installs the operator in a state where every
# DevWorkspace round-trips through the webhook unmutated until one is created.

webhook:
  replicaCount: 2
  # RFC 0002's *Operational considerations*, *Upgrade*: "maxUnavailable: 0" — a moment with no
  # ready webhook endpoint is a moment when no DevWorkspace can be created or started, at
  # failurePolicy: Fail.
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Two replicas is the point of this — "across nodes" per RFC 0002. `preferred`, not
  # `required`, so a single-node cluster still schedules both instead of wedging.
  podAntiAffinity: true
  extraArgs: []
  service:
    port: 443
    targetPort: 9443
  timeoutSeconds: 5

controller:
  replicaCount: 2
  leaderElection: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAntiAffinity: true
  extraArgs: []

metrics:
  service:
    enabled: true
    port: 8081

# `null`/omitted: nothing here is generated by this chart, and there is no self-signed fallback.
# One of `cert-manager` or `openshift` is a real prerequisite — see RFC 0002's *Webhook
# configuration*, *Certificates*.
certificates:
  # "cert-manager" | "openshift" | "none"
  #   cert-manager — this chart renders a `Certificate` (and a self-signed `Issuer`, unless
  #                  `certManager.issuerRef` names an existing one) plus the
  #                  `cert-manager.io/inject-ca-from` annotation on the MutatingWebhookConfiguration.
  #   openshift    — this chart annotates the webhook Service with
  #                  `service.beta.openshift.io/serving-cert-secret-name` and the
  #                  MutatingWebhookConfiguration with `service.beta.openshift.io/inject-cabundle`.
  #                  The platform issues the certificate; nothing else to configure.
  #   none         — this chart renders no MutatingWebhookConfiguration and no Certificate at
  #                  all. Apply your own, pointed at `<fullname>-webhook`'s Service, and make sure
  #                  `secretName` below matches whatever Secret carries `tls.crt`/`tls.key`.
  provider: cert-manager
  secretName: "" # defaults to <fullname>-webhook-tls
  certManager:
    # Left empty: a self-signed Issuer is rendered under the release name. Set both fields to
    # point at an existing Issuer/ClusterIssuer instead.
    issuerRef:
      name: ""
      kind: Issuer

# RFC 0002's *Webhook configuration*: opt-out, not opt-in — every namespace is in scope except
# one carrying this label. A new workspace namespace Che creates automatically must be protected
# without anyone remembering to label it.
namespaceExclusionLabel: hardening.weebo.io/exclude

rbac:
  create: true

# RFC 0004: whether this cluster's CNI is Cilium. Gates the `ciliumnetworkpolicies` RBAC grant
# and the `KubeTemplateStore`/`KubePolicyStore` watch for it — a cluster without Cilium's CRDs
# installed must never be handed (or attempt to use) this permission, per the RFC's "the Cilium
# rules in a separate overlay so a cluster without Cilium never grants them."
# RFC 0006's kubearmor-policy. Off by default, and the flag governs *RBAC*, not the feature:
# whether the feature runs at all is `spec.features.kubearmorPolicy.mode` on the WeeboSiConfig,
# and the controller discovers the CRD at boot regardless. Granting write on a CRD a cluster does
# not have would be a permission nobody can use and everybody has to review, so the grant is
# opt-in — turn this on when KubeArmor is installed.
kubearmorPolicy:
  rbac:
    enabled: false

# RFC 0007's `registry-config`. Off by default, and this flag governs *RBAC and the guard rule*,
# not the feature: whether the feature runs at all is `spec.features.registryConfig.mode` on the
# WeeboSiConfig.
#
# **Read RFC 0007's *Security considerations* before turning this on.** It is the only switch in
# this chart that grants `create`/`update`/`delete` on `secrets` cluster-wide, which is the
# strongest permission this project asks for and cannot be narrowed by RBAC — Kubernetes has no
# name-level grant for create. The narrowing is in code (the ownership label, the
# `namespaceSelector`, the diff) and reviewed as such. It is also the only brick here whose
# compromise makes the cluster *less* safe rather than merely unprotected: an operator that
# distributes registry configuration is an operator that can redirect every build in the fleet.
#
# `failurePolicy` is `Ignore` and, unlike `policyGuard.failurePolicy` above, that is the
# considered default rather than the cautious one — the guarded object is a `ConfigMap`, and a
# fail-closed rule over `configmaps` and `secrets` means a webhook outage blocks configuration
# writes in every workspace namespace. See the rendered rule's own comment for the full argument.
# `Fail` is available for a cluster that would rather take that outage than let a drifted
# `.npmrc` stand for one reconcile interval.
registryConfig:
  rbac:
    enabled: false
  failurePolicy: Ignore

networkProfiles:
  cilium:
    enabled: false
  # The enforcement canary's probe image — RFC 0004's "the only pod we create, in our own
  # namespace, from a pinned image, with no service account token mounted." Whether the probe
  # runs at all is `enforcement.canary.enabled` on the WeeboSiConfig, not a chart value; this is
  # only *which* image it uses when it does.
  #
  # agnhost is Kubernetes' own end-to-end network test image and carries both halves of the probe
  # (`netexec` listens, `connect` dials). It is on registry.k8s.io rather than a rate-limited
  # public registry, and pinned to a tag rather than `latest` — a canary that silently changed
  # what it measures is worse than no canary. Point this at your own mirror on an air-gapped
  # cluster.
  canary:
    image: registry.k8s.io/e2e-test-images/agnhost:2.53

# RFC 0004's `policy-guard`. `failurePolicy: Fail` is the safe default — "a control whose bypass
# is 'make the webhook unavailable' is not a control." A cluster that has *verified* its users
# cannot write `networkpolicies` directly may run at `Ignore` instead — see the RFC's
# *Operational considerations* for the trade-off. This is an install-time decision the chart
# will not make for you by guessing.
policyGuard:
  failurePolicy: Fail

# RFC 0005's `image-policy`. Two webhooks, and only the Pod one has a switch here.
#
# The DevWorkspace webhook is hard-coded to `failurePolicy: Fail`: its blast radius is workspace
# creation and start, RFC 0002 already settled that argument for `dwoc-pin`, and there is no
# cluster for which the answer differs.
#
# The Pod webhook is the harder argument and the one value RFC 0005 leaves to install time:
#
#   Fail   (default) — the floor is real. The Pod half exists specifically to catch what the
#                      DevWorkspace half cannot see (plugin-resolved and DWO-injected images),
#                      and a floor that can be removed by causing an error is not a floor.
#                      Cost: while the operator is unavailable, **no pod is created in any
#                      workspace namespace** — including rescheduling. A node drains and its
#                      workspace pods do not come back until the operator does. That fires on
#                      cluster events nobody initiated, which makes it strictly worse than the
#                      DevWorkspace half's outage.
#   Ignore           — no such outage, and a two-step bypass: make the webhook unavailable,
#                      create the pod. Choose this only knowing that, and knowing the Pod half is
#                      the only layer that sees injected images at all.
#
# This is a decision for whoever carries the pager, not one the chart should make by guessing.
# It is on the install checklist in docs/bricks/weebo-si-operator.md.
#
# `spec.features.imagePolicy` — the catalogue, the grants, the variables, the platform set — is
# configured on the `WeeboSiConfig` object, not here. This chart installs the webhooks in a state
# where every DevWorkspace and every workspace pod round-trips through them and is allowed, until
# an `imagePolicy` block exists and names a mode.
imagePolicy:
  podWebhook:
    failurePolicy: Fail

serviceAccount:
  webhook:
    create: true
    name: ""
  controller:
    create: true
    name: ""

nodeSelector: {}
tolerations: []
