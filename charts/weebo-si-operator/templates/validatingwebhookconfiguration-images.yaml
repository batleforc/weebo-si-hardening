{{- if ne .Values.certificates.provider "none" }}
{{/*
  RFC 0005's *Webhook configuration*: two objects, not one, "because their blast radii are not
  comparable and one object carries one `namespaceSelector`."

  Both serve the same `images.hardening.weebo.io` webhook name and the same feature — one `mode`
  on the WeeboSiConfig gates both, since the two halves report the same FeatureId.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-devworkspaces-validate
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: images.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    # The easy half of the failurePolicy argument, already settled by RFC 0002 for `dwoc-pin`:
    # the blast radius is workspace creation and start, and a control whose bypass is "cause an
    # error" is not a control.
    failurePolicy: Fail
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    rules:
      # `UPDATE` as well as `CREATE`: patching the image onto an existing DevWorkspace is the
      # same act as creating one with it.
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["controller.devfile.io"]
        apiVersions: ["v1alpha1"]
        resources: ["devworkspaces"]
        scope: Namespaced
    # Opt-OUT, per RFC 0002's `dwoc-pin` — and deliberately the *opposite* polarity to the Pod
    # rule below. RFC 0005's *Webhook configuration*: "Every `DevWorkspace` is a workspace by
    # definition, so a namespace reached by accident is a namespace that got hardened."
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate/v1alpha1/devworkspaces
        port: {{ .Values.webhook.service.port }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-pods
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: images.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    # The hard half of the argument, and the one value in RFC 0005 left to install time. `Fail`
    # ships: the Pod half exists specifically to catch what the DevWorkspace half cannot see —
    # plugin-resolved and injected images — and "a floor that can be removed by causing an error
    # is not a floor." The cost is real and stated in that RFC: at `Fail`, an unavailable
    # operator means workspace pods cannot be *rescheduled*, which fires on cluster events
    # nobody initiated. See `values.yaml`'s comment on `imagePolicy.podWebhook.failurePolicy`.
    failurePolicy: {{ .Values.imagePolicy.podWebhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    rules:
      # Three deliberate choices, each closing a bypass RFC 0005 names:
      #   * `UPDATE` — `spec.containers[].image` is one of the few mutable fields on a running
      #     pod, so `CREATE` alone would mean "start a permitted image, then patch it".
      #   * `pods/ephemeralcontainers` — `kubectl debug` adds a container through that
      #     subresource and never through `pods` UPDATE, so a rule listing only `pods` leaves a
      #     one-command bypass.
      #   * no `objectSelector` — selecting only pods labelled as workspace pods would mean a pod
      #     that omits the label is unchecked, and the label is user-writable. The namespace is
      #     the boundary; the label is not.
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
    # Opt-IN, per RFC 0004's `policy-guard` and inverted from the DevWorkspace rule above. A
    # `Pod` is not a workspace by definition: pods exist in every namespace in the cluster, and a
    # mis-scoped deny-pods webhook is a cluster outage rather than an over-hardened namespace.
    # Which namespaces carry `hardening.weebo.io/workspace-namespace` is Che's to say, and it is
    # the same install-checklist line `policy-guard` already depends on.
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: hardening.weebo.io/workspace-namespace
          operator: Exists
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate/v1/pods
        port: {{ .Values.webhook.service.port }}
{{- end }}
