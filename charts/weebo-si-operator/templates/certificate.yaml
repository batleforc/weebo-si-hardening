{{- if eq .Values.certificates.provider "cert-manager" }}
{{- if not .Values.certificates.certManager.issuerRef.name }}
# No existing Issuer named — bring our own self-signed one. Swap `certificates.certManager.issuerRef`
# for a cluster CA if this deployment already has one; the operator itself has no opinion, it
# only reads whatever lands in the Secret named by `certificates.secretName`.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "weebo-si-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
spec:
  secretName: {{ include "weebo-si-operator.tlsSecretName" . }}
  dnsNames:
    - {{ include "weebo-si-operator.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "weebo-si-operator.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.certificates.certManager.issuerRef.name | default (printf "%s-selfsigned" (include "weebo-si-operator.fullname" .)) }}
    kind: {{ .Values.certificates.certManager.issuerRef.kind | default "Issuer" }}
{{- end }}
