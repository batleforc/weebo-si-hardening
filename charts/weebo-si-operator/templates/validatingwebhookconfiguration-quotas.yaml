{{- if and (ne .Values.certificates.provider "none") .Values.resourceQuotas.rbac.enabled }}
{{/*
  RFC 0014's two `policy-guard` rows: a Che user's stock `admin` role only reads
  `resourcequotas` and `limitranges`, but a cluster whose RBAC lets them write those must still
  not be able to edit or delete `weebo-quota` and `weebo-limits`.

  **With an ownership `objectSelector`**, unlike the `kubearmorpolicies` rule. A foreign quota
  (Che's `workspaces-config` replication, an admin's) is counted and left alone by
  `resource-quotas`, so it must stay creatable: only the operator's own objects reach the guard,
  which makes its unmanaged-CREATE row unreachable here — RFC 0008's rule, "one that only
  protects existing objects should" carry a selector.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-resource-quotas
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: resourcequotas.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    # One feature, one failure policy, as for every guarded resource (RFC 0008's *Contract*).
    failurePolicy: {{ .Values.policyGuard.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    rules:
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["resourcequotas", "limitranges"]
        scope: Namespaced
    objectSelector:
      matchLabels:
        hardening.weebo.io/managed-by: weebo-si-operator
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: hardening.weebo.io/workspace-namespace
          operator: Exists
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate/v1/resourcequotas
        port: {{ .Values.webhook.service.port }}
{{- end }}
