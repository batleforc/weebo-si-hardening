{{- if and (ne .Values.certificates.provider "none") .Values.podIdentity.webhooks.enabled }}
{{- /*
  RFC 0018's gate, registered with its mutation (`mutatingwebhookconfiguration.yaml`) by the same
  switch: validation is never registered later than the mutation. A new object at `Fail` carries
  no `caBundle` until the injector patches it, which would refuse every workspace pod meanwhile:
  `dwoc-pin`'s bundle, served by the same Service, is copied as the mutating file does.
*/}}
{{- $caBundle := "" }}
{{- with lookup "admissionregistration.k8s.io/v1" "MutatingWebhookConfiguration" "" (printf "%s-devworkspaces" (include "weebo-si-operator.fullname" .)) }}
{{- range .webhooks }}
{{- if and (eq .name "devworkspaces.hardening.weebo.io") .clientConfig.caBundle }}
{{- $caBundle = .clientConfig.caBundle }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-pods-identity
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: pod-identity-validate.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    # Fixed, not a value: a floor removable by causing an error is not a floor.
    failurePolicy: Fail
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    rules:
      # No `pods` UPDATE (L21): `hostUsers` and the security contexts are immutable, and the rule
      # would only block finalizer removal during an outage. `kubectl debug` adds a container
      # through `pods/ephemeralcontainers`, which is judged.
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
      - operations: ["UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods/ephemeralcontainers"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: hardening.weebo.io/workspace-namespace
          operator: Exists
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate/v1/pods/identity
        port: {{ .Values.webhook.service.port }}
      {{- with $caBundle }}
      caBundle: {{ . }}
      {{- end }}
{{- end }}
