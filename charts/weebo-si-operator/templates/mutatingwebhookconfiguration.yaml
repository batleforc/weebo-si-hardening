{{- if ne .Values.certificates.provider "none" }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-devworkspaces
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: devworkspaces.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: Fail
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: IfNeeded
    rules:
      - operations: ["CREATE", "UPDATE"]
        # DevWorkspace Operator serves DevWorkspace as `workspace.devfile.io` (v1alpha2 is the
        # storage version; `matchPolicy: Equivalent` also routes a v1alpha1 request here). Not
        # `controller.devfile.io`, the group of its *config* CRD and of the attribute keys.
        apiGroups: ["workspace.devfile.io"]
        apiVersions: ["v1alpha2"]
        resources: ["devworkspaces"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate/v1alpha1/devworkspaces
        port: {{ .Values.webhook.service.port }}
  {{- if .Values.imageRewrite.webhooks.enabled }}
  # RFC 0017's DevWorkspace rewrite (resolved 8): a second webhook in this object, on its own
  # path served by the image-policy adapters, so `dwoc-pin`'s route stays untouched. Same rules
  # and selector as above; the apiserver applies each webhook's patch in turn, and
  # `reinvocationPolicy: IfNeeded` covers the order. It never denies, so `Fail` costs only an
  # unavailable operator, which the webhook above already costs.
  - name: images-rewrite.devworkspaces.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: Fail
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: IfNeeded
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["workspace.devfile.io"]
        apiVersions: ["v1alpha2"]
        resources: ["devworkspaces"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate/v1alpha1/devworkspaces/images
        port: {{ .Values.webhook.service.port }}
  {{- end }}
{{- if .Values.imageRewrite.webhooks.enabled }}
---
{{/*
  RFC 0017's Pod rewrite: the images DevWorkspace Operator and Che inject, which no DevWorkspace
  names. Rules and selector identical to the `image-policy` Pod rule, and its `failurePolicy`
  (resolved 2): the two webhooks guard the same pods and fail for the same reason.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-pods
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: images-rewrite.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: {{ .Values.imagePolicy.podWebhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: IfNeeded
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: hardening.weebo.io/workspace-namespace
          operator: Exists
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate/v1/pods
        port: {{ .Values.webhook.service.port }}
{{- end }}
{{- end }}
