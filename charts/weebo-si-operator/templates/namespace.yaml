{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.labels" . | nindent 4 }}
    {{ .Values.namespaceExclusionLabel }}: "true"
    {{- with .Values.namespace.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
