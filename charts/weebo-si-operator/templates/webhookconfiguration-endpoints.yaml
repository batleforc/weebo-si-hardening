{{- if and (ne .Values.certificates.provider "none") .Values.endpointAuth.rbac.enabled }}
{{/*
  RFC 0009's two rules, and the one decision that makes `failurePolicy: Fail` on `ingresses`
  defensible: the `namespaceSelector`.

  A webhook in front of *every* `Ingress` in the cluster, failing closed, is an outage of every
  `kubectl apply` touching ingress the day the operator is unhealthy. Scoped to Che workspace
  namespaces, a failure can only affect workspace endpoints — DevWorkspace Operator retries its
  creation with backoff, so what a developer meets is an endpoint that appears late, not a
  workspace that fails to start.

  **No objectSelector, deliberately.** One on the DevWorkspace label would be tighter and would
  leave a developer's own `Ingress` outside the webhook and therefore outside the gate — the
  bypass RFC 0009's *Which `Ingress` answers for a host* closes. RFC 0008's rule applies without
  exception: a guard that must refuse unmanaged creates cannot use an ownership selector.

  **One rule per kind, gated on the dialect.** A cluster whose apiserver does not serve
  `route.openshift.io/v1` must not carry a webhook rule for it, and a vanilla cluster running
  Traefik should not be asked about Routes that do not exist. Switching a cluster from `Traefik`
  to `OpenShiftRoute` is therefore a chart value, not a code path.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-endpoints
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  {{- if eq .Values.endpointAuth.dialect "OpenShiftRoute" }}
  - name: routes.endpointauth.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: {{ .Values.endpointAuth.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    # The patch is idempotent, so reinvocation costs nothing — and it is what makes the feature
    # self-healing against DevWorkspace Operator's own rewrites.
    reinvocationPolicy: IfNeeded
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        resources: ["routes"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: {{ .Values.endpointAuth.namespaceLabel.key }}
          operator: In
          values: [{{ .Values.endpointAuth.namespaceLabel.value | quote }}]
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate/v1/routes
        port: {{ .Values.webhook.service.port }}
  {{- else }}
  - name: ingresses.endpointauth.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: {{ .Values.endpointAuth.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: IfNeeded
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        resources: ["ingresses"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: {{ .Values.endpointAuth.namespaceLabel.key }}
          operator: In
          values: [{{ .Values.endpointAuth.namespaceLabel.value | quote }}]
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate/v1/ingresses
        port: {{ .Values.webhook.service.port }}
  {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-endpoints
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certificates.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-si-operator.webhookServiceName" . }}
    {{- else if eq .Values.certificates.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
webhooks:
  - name: {{ if eq .Values.endpointAuth.dialect "OpenShiftRoute" }}routes{{ else }}ingresses{{ end }}.endpointauthguard.hardening.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: {{ .Values.endpointAuth.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    rules:
      # `DELETE` is validated but allowed for the endpoint's own user — a deliberate departure
      # from RFC 0004's "deleting the baseline is the cheapest bypass". Deleting a `NetworkPolicy`
      # removes a restriction and leaves the workload reachable; deleting the `Ingress` removes
      # the gate *and the route it sits on*, so there is nothing left to reach. It is covered by
      # the rule anyway, because the guard's verdict for it is a decision rather than an absence.
      - operations: ["CREATE", "UPDATE", "DELETE"]
        {{- if eq .Values.endpointAuth.dialect "OpenShiftRoute" }}
        apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        resources: ["routes"]
        {{- else }}
        apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        resources: ["ingresses"]
        {{- end }}
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.namespaceExclusionLabel }}
          operator: DoesNotExist
        - key: {{ .Values.endpointAuth.namespaceLabel.key }}
          operator: In
          values: [{{ .Values.endpointAuth.namespaceLabel.value | quote }}]
    clientConfig:
      service:
        name: {{ include "weebo-si-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: {{ if eq .Values.endpointAuth.dialect "OpenShiftRoute" }}/validate/v1/routes{{ else }}/validate/v1/ingresses{{ end }}
        port: {{ .Values.webhook.service.port }}
{{- end }}
