{{- if .Values.rbac.create }}
# RFC 0002's Security considerations: "The webhook role needs, cluster-wide: get, list, watch on
# weebosiconfigs / devworkspaceoperatorconfigs / namespaces ... and the controller role adds
# update and patch on weebosiconfigs/status, plus create on events." Shared by both
# ServiceAccounts, never granted through one combined role — the webhook role, the one an
# untrusted AdmissionReview body reaches, never holds the write permission only the controller
# needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-watch
  labels:
    {{- include "weebo-si-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hardening.weebo.io"]
    resources: ["weebosiconfigs"]
    verbs: ["get", "list", "watch"]
  # RFC 0011. Read-only, and shared by both roles: teams carry the catalogues and the grants both
  # halves resolve against, so a webhook that cannot read them answers with the cluster default
  # for every namespace. Users are read by the controller (provisioning) and by the endpoint
  # gateway (declared team membership); neither role may write either kind, because nothing in
  # this operator is supposed to invent a team or a person.
  - apiGroups: ["hardening.weebo.io"]
    resources: ["weebositeams", "weebosiusers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["controller.devfile.io"]
    resources: ["devworkspaceoperatorconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # RFC 0004. Read-only, and shared by both roles for different reasons: the controller diffs
  # against it, and the webhook needs it to answer "does this namespace have its baseline yet"
  # for the DevWorkspace CREATE gate. Deliberately *not* the write verbs — those stay on the
  # controller-only role below, so the webhook role (the one an untrusted AdmissionReview body
  # reaches) still holds nothing but watches.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.networkProfiles.cilium.enabled }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.kubearmorPolicy.rbac.enabled }}
  # RFC 0006. Read-only on the shared role for the same reason the networkpolicies rule above is
  # shared: the controller diffs against it, and the webhook role holds nothing but watches.
  - apiGroups: ["security.kubearmor.com"]
    resources: ["kubearmorpolicies"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # The read halves of RFC 0009's `endpoint-auth` (`ingresses`, `routes`) and RFC 0007's
  # `registry-config` (`configmaps`, `secrets`) are on the controller-only role below, not here:
  # the webhook reads those objects out of the AdmissionReview body and never from the apiserver,
  # so a shared grant would hand the pod an untrusted body reaches a cluster-wide read of every
  # Secret for nothing.
  # RFC 0005's `image-policy` adds **nothing here, and nothing to the controller role either** —
  # no verb, no resource, no Role. Both of its subjects arrive in the admission body, and the
  # only lookup either route makes is the `namespaces` watch three rules up, which already
  # existed. `images audit`'s `list pods` is the *admin's* own permission, exercised from their
  # kubeconfig, never this ServiceAccount's. Recorded as a rule rather than left as an absence:
  # the role an untrusted AdmissionReview body reaches is unchanged by that RFC, and a future
  # edit that adds a grant "for image-policy" is a change RFC 0005 argues against by name (see
  # its *Future work* on resolving the per-workspace selection at the Pod layer).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-webhook-watch
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "weebo-si-operator.fullname" . }}-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.webhookServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-watch
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "weebo-si-operator.fullname" . }}-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# What only the controller role adds — RFC 0002's original "no permission on DevWorkspaces at
# all — not even read" stops being true here, per RFC 0004's *Security considerations*: "a
# controller has no admission request to read the object from." The last two rules are this
# RFC's own, and the largest single grant in this repo — writing `networkpolicies` cluster-wide
# is the ability to cut the network of anything in the cluster. Bounded by code, not RBAC: the
# ownership label, the namespace exclusions, and the diff — see the RFC for the argument.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-status
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["hardening.weebo.io"]
    resources: ["weebosiconfigs/status"]
    verbs: ["update", "patch"]
  # RFC 0011: the two kinds report their own readiness, and a status patch is the only write this
  # operator makes to either.
  - apiGroups: ["hardening.weebo.io"]
    resources: ["weebositeams/status", "weebosiusers/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["workspace.devfile.io"]
    resources: ["devworkspaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  {{- if .Values.networkProfiles.cilium.enabled }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.kubearmorPolicy.rbac.enabled }}
  # RFC 0006's own grants, and the three of them are of very different sizes.
  #
  # Writing `kubearmorpolicies` cluster-wide is the same shape as writing `networkpolicies`
  # above — the ability to constrain, or to *un*constrain, what any workspace process may do.
  # Bounded by code rather than RBAC: the ownership label, the namespace exclusions, the diff.
  - apiGroups: ["security.kubearmor.com"]
    resources: ["kubearmorpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  # `patch` on namespaces, for KubeArmor's three `kubearmor-*-posture` annotations and nothing
  # else. Kubernetes RBAC cannot say "these three annotation keys", so the narrowing is in the
  # adapter (a merge patch of exactly those keys) and reviewed as code — the same trade this
  # project already accepts for the Node projection below. `get/list/watch` on namespaces is
  # already granted by the shared role above; only the write is added here.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["patch"]
  # Read-only, and this is the first cluster-scoped read in this project that is not its own CRD:
  # `nodes` for the `kubearmor.io/enforcer` label, `pods` for `spec.nodeName`, joined behind
  # NodeEnforcerView to answer "is a policy written here actually enforced". RBAC has no
  # field-level grant for either, so the projection is enforced in the watch stream before
  # anything reaches a cache — see crates/weebo-si-runtime/src/node_enforcer.rs.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.endpointAuth.rbac.enabled }}
  # RFC 0009's write half. `patch` and nothing else on the routing objects: the sweep writes the
  # dialect's annotations and, on a `ReverseProxy` dialect, the backend — it never creates or
  # deletes one, because those objects belong to DevWorkspace Operator and to the developer.
  # Narrowed in code rather than by RBAC, which has no annotation-level grant: the patch is built
  # from `EndpointAuthConfig::attachment` and can only ever carry the keys the dialect owns.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "patch"]
  {{- if eq .Values.endpointAuth.dialect "OpenShiftRoute" }}
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "patch"]
  # The companion `Service` and its `EndpointSlice`, in every workspace namespace — the price of
  # a router that cannot be asked a question, since a `Route`'s `spec.to` is a local reference
  # with no cross-namespace form. Only this dialect needs them, so only this dialect grants them.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- end }}
  {{- if .Values.registryConfig.rbac.enabled }}
  # RFC 0007's write half, and the strongest permission this project has asked for. Read its
  # *Security considerations → Privileges* before granting it:
  #
  #   "an operator that can write a `Secret` into a workspace namespace can write any `Secret`
  #    into any workspace namespace, and one that can read them in its own namespace can read
  #    every template. The minimum is real but not small — the write half cannot be narrowed by
  #    RBAC below 'secrets in namespaces this controller reconciles', because Kubernetes RBAC has
  #    no name-level grant for create."
  #
  # What narrows it in practice is the same thing that narrows `networkpolicies` above: the
  # controller only ever touches objects carrying its own managed-by label, enforced in the
  # adapter and reviewed as code, plus the `namespaceSelector` bounding which namespaces it
  # reconciles at all. Off by default — this is a decision for whoever carries the pager.
  #
  # This is also the one brick whose compromise makes the cluster *less* safe rather than merely
  # unprotected: an operator that distributes registry configuration is an operator that can
  # redirect every build in the fleet. RFC 0007's *Drawbacks and risks* says so in those words.
  #
  # `get/list/watch` is here too and **only** here: the controller needs it for the *templates*
  # (the operator's own namespace) and for the *copies* it diffs against in every workspace
  # namespace. Kubernetes RBAC cannot say "only objects carrying this label", so the narrowing is
  # in code — every watch over `secrets` is filtered by `hardening.weebo.io/managed-by`
  # server-side (the copies) or scoped to one namespace (the templates). The webhook role does not
  # hold it: the registry guard reads the object out of the AdmissionReview body.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.identity.rbac.enabled }}
  # RFC 0011's provisioning half, and the point where this operator stops only constraining
  # other people's workloads and starts creating objects in other people's systems. Read that
  # RFC's *Security considerations → Blast radius* before granting it.
  #
  # `authentikusers` cluster-wide, because the upstream CRD is cluster-scoped. **No `delete`**,
  # here or below: everything this operator creates carries an `ownerReference` to the
  # `WeeboSiUser` it was created for, so removal happens through garbage collection and this
  # ServiceAccount has no verb with which to remove somebody else's object.
  - apiGroups: ["authentik.weebo.io"]
    resources: ["authentikusers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-status
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "weebo-si-operator.fullname" . }}-controller-status
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.identity.rbac.enabled }}
---
# RFC 0011's Argo CD half — a `Role`, not a `ClusterRole`, and that is the whole point.
# `spec.features.identity.che.applicationNamespace` is a cluster-level field precisely so this
# grant can be one namespace: an operator that could write an `Application` anywhere is an
# operator that could deploy anything anywhere Argo's projects allow. Keep this namespace and
# that field in step — a mismatch reads as "nothing is ever provisioned", with a `Degraded`
# condition naming the refused write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-applications
  namespace: {{ .Values.identity.argoNamespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-applications
  namespace: {{ .Values.identity.argoNamespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-si-operator.fullname" . }}-controller-applications
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.endpointAuth.rbac.enabled (eq .Values.endpointAuth.dialect "Traefik") }}
---
# The one shared `forwardAuth` Middleware, in the operator's own namespace — a `Role`, because that
# is the only namespace the controller ever writes it in. An `Ingress` naming a middleware that
# does not exist is an `Ingress` Traefik refuses to route, so the object has to exist before the
# first annotation names it; a cluster-wide grant here would be the ability to rewrite any
# middleware chain in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-middleware
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-middleware
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-si-operator.fullname" . }}-controller-middleware
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.controller.leaderElection }}
---
# The leader-election lease — namespaced, not part of RFC 0002's original three-row RBAC table
# (added after the RFC's original acceptance, alongside `--leader-election` itself). A lease is
# per-namespace by construction and the controller only ever takes one, in its own namespace, so
# this stays a Role/RoleBinding rather than a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-si-operator.fullname" . }}-controller-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# The canary's whole grant: create and delete pods, in the operator's own namespace only. A
# `Role`, not a `ClusterRole` — RFC 0004's *Security considerations*: "it must be impossible for
# it to create one anywhere but at home."
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-si-operator.fullname" . }}-controller-canary
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
