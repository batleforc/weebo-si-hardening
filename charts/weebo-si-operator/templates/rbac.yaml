{{- if .Values.rbac.create }}
# RFC 0002's Security considerations: "The webhook role needs, cluster-wide: get, list, watch on
# weebosiconfigs / devworkspaceoperatorconfigs / namespaces ... and the controller role adds
# update and patch on weebosiconfigs/status, plus create on events." Shared by both
# ServiceAccounts, never granted through one combined role — the webhook role, the one an
# untrusted AdmissionReview body reaches, never holds the write permission only the controller
# needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-watch
  labels:
    {{- include "weebo-si-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hardening.weebo.io"]
    resources: ["weebosiconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["controller.devfile.io"]
    resources: ["devworkspaceoperatorconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # RFC 0004. Read-only, and shared by both roles for different reasons: the controller diffs
  # against it, and the webhook needs it to answer "does this namespace have its baseline yet"
  # for the DevWorkspace CREATE gate. Deliberately *not* the write verbs — those stay on the
  # controller-only role below, so the webhook role (the one an untrusted AdmissionReview body
  # reaches) still holds nothing but watches.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.networkProfiles.cilium.enabled }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # RFC 0005's `image-policy` adds **nothing here, and nothing to the controller role either** —
  # no verb, no resource, no Role. Both of its subjects arrive in the admission body, and the
  # only lookup either route makes is the `namespaces` watch three rules up, which already
  # existed. `images audit`'s `list pods` is the *admin's* own permission, exercised from their
  # kubeconfig, never this ServiceAccount's. Recorded as a rule rather than left as an absence:
  # the role an untrusted AdmissionReview body reaches is unchanged by that RFC, and a future
  # edit that adds a grant "for image-policy" is a change RFC 0005 argues against by name (see
  # its *Future work* on resolving the per-workspace selection at the Pod layer).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-webhook-watch
  labels:
    {{- include "weebo-si-operator.webhook.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "weebo-si-operator.fullname" . }}-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.webhookServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-watch
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "weebo-si-operator.fullname" . }}-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# What only the controller role adds — RFC 0002's original "no permission on DevWorkspaces at
# all — not even read" stops being true here, per RFC 0004's *Security considerations*: "a
# controller has no admission request to read the object from." The last two rules are this
# RFC's own, and the largest single grant in this repo — writing `networkpolicies` cluster-wide
# is the ability to cut the network of anything in the cluster. Bounded by code, not RBAC: the
# ownership label, the namespace exclusions, and the diff — see the RFC for the argument.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-status
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["hardening.weebo.io"]
    resources: ["weebosiconfigs/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["controller.devfile.io"]
    resources: ["devworkspaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  {{- if .Values.networkProfiles.cilium.enabled }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-status
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "weebo-si-operator.fullname" . }}-controller-status
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.controller.leaderElection }}
---
# The leader-election lease — namespaced, not part of RFC 0002's original three-row RBAC table
# (added after the RFC's original acceptance, alongside `--leader-election` itself). A lease is
# per-namespace by construction and the controller only ever takes one, in its own namespace, so
# this stays a Role/RoleBinding rather than a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-si-operator.fullname" . }}-controller-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# The canary's whole grant: create and delete pods, in the operator's own namespace only. A
# `Role`, not a `ClusterRole` — RFC 0004's *Security considerations*: "it must be impossible for
# it to create one anywhere but at home."
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-si-operator.fullname" . }}-controller-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-si-operator.controller.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-si-operator.fullname" . }}-controller-canary
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-si-operator.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
