            description: '`spec` of the `WeeboSiUser` CRD.'
            properties:
              active:
                default: true
                description: |-
                  `false` suspends provisioning without deleting anything: the `AuthentikUser` is written
                  with `isActive: false` and the application is left alone.
                type: boolean
              authentik:
                description: The identity provider half.
                nullable: true
                properties:
                  groupRefs:
                    default: []
