{{- /*
  RFC 0003's trust boundary, enforced at the network: the proxy hands every request that reaches
  it a full-privilege upstream credential, so only the forward-auth gateway may reach it. A pod in
  the same namespace calling the Service directly is exactly the bypass the RFC names.

  Ingress only. Kubelet probes come from the node and are not subject to pod NetworkPolicy on
  mainstream CNIs.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $gw := .Values.networkPolicy.gateway }}
{{- /* A selector only narrows anything when it carries matchLabels or matchExpressions: `{}`
       and `{matchLabels: {}}` both select everything. */}}
{{- $nsNarrows := or (not (empty (dig "matchLabels" (dict) ($gw.namespaceSelector | default (dict))))) (not (empty (dig "matchExpressions" (list) ($gw.namespaceSelector | default (dict))))) }}
{{- $podNarrows := or (not (empty (dig "matchLabels" (dict) ($gw.podSelector | default (dict))))) (not (empty (dig "matchExpressions" (list) ($gw.podSelector | default (dict))))) }}
{{- if not (or $nsNarrows $podNarrows) }}
{{- fail "networkPolicy.enabled needs networkPolicy.gateway.namespaceSelector and/or .podSelector with non-empty matchLabels or matchExpressions — with neither, the rule would admit every pod in the namespace, which is the bypass the policy exists to close" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "preauth-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preauth-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "preauth-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The forward-auth gateway, and nothing else, on the proxy port.
    {{- $peer := dict }}
    {{- /* Full LabelSelector objects, rendered as given (matchLabels and/or matchExpressions). */}}
    {{- with $gw.namespaceSelector }}{{ $_ := set $peer "namespaceSelector" . }}{{ end }}
    {{- with $gw.podSelector }}{{ $_ := set $peer "podSelector" . }}{{ end }}
    - from:
        - {{ toYaml $peer | nindent 10 | trim }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.metrics }}
    {{- if and .port .from }}
    # Metrics scrapers, on the metrics port only — never on the proxy port.
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
