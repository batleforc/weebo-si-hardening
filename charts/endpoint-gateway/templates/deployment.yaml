apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "endpoint-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "endpoint-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # `maxUnavailable: 0`, because the gate fails closed: a moment with one fewer ready replica
      # under load is a moment when some workspace endpoint answers 503 to its developer.
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "endpoint-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "endpoint-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the configuration changes: this file is read once, at boot.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "endpoint-gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "endpoint-gateway.selectorLabels" . | nindent 20 }}
      {{- end }}
      # SIGTERM marks the replica not-ready, waits five seconds for that to reach the endpoints
      # controller, then drains in-flight requests for at most twenty: inside thirty.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: endpoint-gateway
          image: {{ include "endpoint-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/endpoint-gateway/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            - name: ENDPOINT_GATEWAY_SESSION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sessionKeys.existingSecret }}
                  key: {{ .Values.secrets.sessionKeys.key }}
            - name: ENDPOINT_GATEWAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clientSecret.existingSecret }}
                  key: {{ .Values.secrets.clientSecret.key }}
          volumeMounts:
            - name: config
              mountPath: /etc/endpoint-gateway
              readOnly: true
            {{- if or .Values.extraCa.configMap .Values.extraCa.secret }}
            - name: extra-ca
              mountPath: /etc/endpoint-gateway-ca
              readOnly: true
            {{- end }}
          # The listener is bound only once the informers have synced, which on a large cluster
          # takes longer than a liveness probe should wait: the startup probe owns that window,
          # and liveness starts counting only after it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # Readiness is wired to the informer sync, not just to the process being up: a cold
          # replica must not answer "allow" from an empty cache, and it must not answer "deny"
          # from one either — staying out of the rotation is the correct third answer.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "endpoint-gateway.fullname" . }}
        {{- if and .Values.extraCa.configMap .Values.extraCa.secret }}
        {{- fail "extraCa: name a configMap or a secret, not both" }}
        {{- else if .Values.extraCa.configMap }}
        - name: extra-ca
          configMap:
            name: {{ .Values.extraCa.configMap }}
            items:
              - key: {{ .Values.extraCa.key }}
                path: {{ .Values.extraCa.key }}
        {{- else if .Values.extraCa.secret }}
        - name: extra-ca
          secret:
            secretName: {{ .Values.extraCa.secret }}
            items:
              - key: {{ .Values.extraCa.key }}
                path: {{ .Values.extraCa.key }}
        {{- end }}
