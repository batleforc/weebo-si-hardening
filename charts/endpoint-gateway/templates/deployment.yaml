apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "endpoint-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "endpoint-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # `maxUnavailable: 0`, because the gate fails closed: a moment with one fewer ready replica
      # under load is a moment when some workspace endpoint answers 503 to its developer.
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "endpoint-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "endpoint-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the configuration changes: this file is read once, at boot.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "endpoint-gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "endpoint-gateway.selectorLabels" . | nindent 20 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: endpoint-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/endpoint-gateway/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENDPOINT_GATEWAY_SESSION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sessionKeys.existingSecret }}
                  key: {{ .Values.secrets.sessionKeys.key }}
            - name: ENDPOINT_GATEWAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clientSecret.existingSecret }}
                  key: {{ .Values.secrets.clientSecret.key }}
          volumeMounts:
            - name: config
              mountPath: /etc/endpoint-gateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          # Readiness is wired to the informer sync, not just to the process being up: a cold
          # replica must not answer "allow" from an empty cache, and it must not answer "deny"
          # from one either — staying out of the rotation is the correct third answer.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "endpoint-gateway.fullname" . }}
