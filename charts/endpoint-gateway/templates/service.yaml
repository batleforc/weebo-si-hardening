apiVersion: v1
kind: Service
metadata:
  name: {{ include "endpoint-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "endpoint-gateway.labels" . | nindent 4 }}
spec:
  {{- if .Values.service.trafficDistribution }}
  # RFC 0009's *Request cost*, rule 2: keep the hop short. The decision is microseconds; the
  # round trip from the ingress controller is the only part anyone can measure, so it should not
  # cross a zone to reach a replica.
  trafficDistribution: {{ .Values.service.trafficDistribution }}
  {{- end }}
  selector:
    {{- include "endpoint-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
