# The `endpoint-gateway` deployment — RFC 0009's *What the admin installs*.
#
# Read *Failure mode* before tuning anything here down. The gate fails **closed**: with the
# gateway unavailable, every workspace endpoint stops serving. That is a deliberate choice —
# "the feature's entire value is that the FQDN path is closed, and a control that opens under
# load is one an attacker can arrange to have open" — and the bill for it is itemised in the
# defaults below: three replicas, anti-affinity, a PodDisruptionBudget, `maxUnavailable: 0`, and
# `system-cluster-critical`.

image:
  # What `.github/workflows/release.yaml` pushes: `ghcr.io/<repository owner>/<crate>`, tagged
  # `<version>` and `<major>.<minor>` from the `v*` git tag, and cosign-signed by digest.
  repository: ghcr.io/batleforc/endpoint-gateway
  tag: ""  # defaults to .Chart.AppVersion — the release workflow sets it from the git tag
  # Optional `sha256:…`. When set it wins over `tag` (`repository@digest`), pinning the exact
  # signed artifact rather than a tag that could be re-pushed.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Three, not two: this process is on the request path of every workspace endpoint in the cluster,
# where the operator's webhook is only on the path of a workspace *start*.
replicaCount: 3
rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1
podAntiAffinity: true
priorityClassName: system-cluster-critical

# An HPA on request rate rather than a bigger fixed size: RFC 0009's *Capacity* sizes the default
# at roughly seven times a pessimistic cluster peak, and the autoscaler exists for the day that
# estimate is wrong rather than because it is expected to be.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  port: 4180
  # Keeps the forward-auth hop in-zone with the controller that makes it. The hop is the only
  # part of a decision measured in milliseconds, so this is the one scheduling hint that shows up
  # in a latency graph.
  trafficDistribution: PreferClose

# `/metrics` on a port of its own, which no Ingress routes — scrape it in-cluster. Disabled, it
# is served on the main port instead (still not routed by the chart's Ingress).
metrics:
  enabled: true
  port: 9090

# Probe timings, explicit rather than the kubelet's defaults. The startup probe covers the
# informer sync that happens before the listener is bound (up to failureThreshold × periodSeconds
# = 120s by default); liveness and readiness only start once it has passed.
probes:
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

# SIGTERM → not ready → 5s → stop accepting → at most 20s draining. Keep this above 25.
terminationGracePeriodSeconds: 30

# An optional NetworkPolicy admitting only the ingress controller (to `http`) and monitoring (to
# `metrics`, while `metrics.enabled`). Every other caller — in particular every workspace pod — is
# refused, which is what keeps a pod from asking for verdicts on `/auth` directly with a
# client-address header of its choosing. Strongly recommended.
#
# Off by default because the selectors are the cluster's to know. To turn it on, check (and
# usually change) the two selector pairs below — the defaults assume Traefik in namespace
# `traefik` and a scraper in namespace `monitoring` — then set `enabled: true`:
#
#   ingressController   the pods that call `/auth` and carry the login paths: e.g.
#                       `kubernetes.io/metadata.name: haproxy-ingress` for haproxy-ingress,
#                       or `openshift-ingress` for the OpenShift router; narrow with `podSelector`
#                       (e.g. `app.kubernetes.io/name: traefik`) if that namespace runs more.
#   monitoring          your Prometheus (or other scraper) namespace and pods.
#
# Each selector is a full LabelSelector (`matchLabels`/`matchExpressions`); `namespaceSelector: {}`
# admits every namespace. Also restrict `config.trustedProxy` to the ingress controller's pod CIDR.
networkPolicy:
  enabled: false
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: traefik
    podSelector: {}
  monitoring:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
  # Further `ingress` rules, verbatim (e.g. an `ipBlock` for the node CIDR).
  extraIngress: []

# The gateway's own host — the one place a browser is ever sent to sign in. Only the login paths
# are routed (`/oidc/start`, `/oidc/callback`, `/oidc/backchannel-logout`, `/host-session`,
# `/sign_out`, and `/selftest` while the self-origin probe runs); `/auth`, `/healthz`, `/readyz`
# and `/metrics` are in-cluster only.
ingress:
  enabled: true
  className: traefik
  host: auth.weebo.si
  annotations: {}
  tls:
    enabled: true
    secretName: ""

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    memory: 512Mi

# Everything under `config` is rendered into the gateway's configuration file. The catalogue, the
# grants, the overrides and the host-ownership patterns are **not** here: the gateway watches
# `WeeboSiConfig` for those, so a grant edit takes effect at informer lag rather than at a
# redeploy, and there is one source of truth rather than two that can disagree.
config:
  issuer: https://sso.weebo.si/realms/weebo
  clientId: che-client
  redirectUrl: https://auth.weebo.si/oidc/callback
  claims:
    # Must be the claim Che derives its username from, or every owner check fails closed and
    # every developer is locked out of their own endpoint. `--check` verifies it against the
    # discovery document before the first request.
    username: preferred_username
    groups: groups
  hosts:
    suffix: .weebo.si
    exclude:
      - che.weebo.si
      - auth.weebo.si
  session:
    ssoTtlSecs: 43200
    hostTtlSecs: 3600
    hostSliding: true
    grantTtlSecs: 30
    maxGroups: 64
  bearer:
    verifyOwnIssuer: true
    # **Required, and empty refuses to start.** "This issuer minted it" is not a specification:
    # on a realm with more than one client it accepts every token that realm has ever minted, for
    # every client, which is a confused deputy rather than a shortcut. Add an audience mapper for
    # this value to the Che OIDC client before rolling the feature out, and confirm it with
    # `endpoint-gateway --check --explain-token` on a real token.
    audiences:
      - endpoint-gateway
    # The compatibility mode for a cluster whose realm client cannot be edited: a token whose
    # `aud` names nobody we know is accepted when its `azp` is on this list. Every entry is a
    # startup WARNING and its own metric label
    # (weebo_si_endpoint_auth_bearer_total{result="accepted_authorized_party"}), because it
    # accepts a credential minted for somebody else's audience. Prefer the mapper.
    authorizedParties: []
    # For issuers whose access tokens are opaque — Che on OpenShift, whose OAuth server mints
    # `sha256~…` strings with no signature and no claims. Off by default and worth leaving off
    # where the issuer can mint JWT access tokens instead (RFC 9068): introspection cannot verify
    # offline, so an identity-provider outage stops a caller holding a valid opaque token.
    introspection:
      enabled: false
      # Empty means the discovery document's `introspection_endpoint`. On with neither is a
      # refusal to start, not a warning.
      endpoint: ""
      negativeTtlSecs: 30
      perAddressPerMinute: 60
    serviceAccountToken: true
    foreign: Reject
  selfOrigin:
    # `Auto` starts with pod-address identity OFF and turns it on only once the self-origin probe
    # has conclusively seen the ingress controller strip or overwrite a forged client-address
    # header; a forgery seen by any replica turns it off on all of them (recorded as an
    # annotation on the revocation ConfigMap, removed by an admin). `On` trusts it from the start;
    # `Off` never does. `Auto` with the probe disabled is effectively `Off`.
    podNetwork: Auto
    # Where `/auth` finds the caller's address; its rightmost entry is read. `X-Forwarded-For`
    # for Traefik: the operator's `Middleware` sets `trustForwardHeader: false`, so `forwardAuth`
    # deletes `X-Real-Ip` from the `/auth` request and sets `X-Forwarded-For` to the connection's
    # address alone. haproxy-ingress forwards only `x-real-ip` (its `auth-headers-request`): set
    # `X-Real-Ip` there. A header that never arrives counts as
    # `weebo_si_endpoint_auth_self_origin_total{result="missing_header"}`.
    clientIpHeader: X-Forwarded-For
    serviceAccountToken: true
    # Which connections may state a caller's address. `any` is right on a forward-auth
    # deployment, where the only thing that calls `/auth` is the ingress controller. With
    # `reverseProxy: true` every caller reaches this process directly, so it must be the
    # router's CIDRs instead — the gateway refuses to start on the unsafe combination rather
    # than trusting a header anybody can set.
    trustedProxy: any
    # Real CIDRs (a bare address, or a legacy whole-octet prefix like "10.128.", also work):
    # trustedProxy:
    #   cidrs: ["10.128.0.0/14"]
  # Carry traffic as well as deciding about it. `true` only on OpenShift, whose router has no
  # external-auth hook: it puts this process on the data path of every WebSocket, upload and
  # streamed response, and makes capacity a bandwidth question rather than a decisions-per-second
  # one.
  #
  # **Deferred.** The mode is implemented and unvalidated — no OpenShift router has ever served a
  # request through it — so the gateway logs a warning at startup when it is on, and its tests
  # are a tier the base suite skips (`task test:openshift`). Leave it false.
  reverseProxy: false
  probe:
    enabled: true
    intervalSeconds: 900
  revalidation:
    mode: WhenNoBackchannel
    intervalSecs: 3600
  cache:
    identityMaxEntries: 20000
    identityTtlSecs: 300
    tokenReviewMaxEntries: 5000
  rules:
    maxPerEndpoint: 16
    rejectUnnormalisedPath: true
    onUnknownKey: Default
  # `Observe` computes, logs and counts every decision and answers 200 regardless — RFC 0009's
  # third rollout step, and the only way to learn which endpoint a probe has been hitting
  # unauthenticated for a year *before* the probe breaks.
  enforcement: Enforce
  revealOwner: true
  # The login surface's per-address limit — `/oidc/start`, `/oidc/callback`, `/host-session` and
  # `/oidc/backchannel-logout`, in front of the cryptography rather than behind it. `/auth` is
  # exempt: the ingress controller is its only caller. Deliberately generous — where the
  # controller states no client address every caller shares one bucket, so a number tuned to one
  # browser would become a cluster-wide sign-in cap. `0` turns it off.
  rateLimit:
    loginPerAddressPerMinute: 300
    # `/oidc/backchannel-logout` on a bucket of its own: every call comes from the identity
    # provider's one egress address, a realm-wide logout is a burst from it, and the provider does
    # not retry. Over the limit is answered 503. `0` turns it off.
    backchannelLogoutPerMinute: 6000
  backchannelLogout:
    # Off: the endpoint answers 404 and is not routed on the public Ingress. The revocation
    # ConfigMap is still watched either way.
    enabled: true
    configmap: endpoint-auth-revocations

# The session keys and the OIDC client secret. Both are `Secret` references rather than values:
# a chart value ends up in `helm get values`, in a CI log, and in whatever holds the release
# state.
secrets:
  # 32 random bytes, base64, newest first, comma-separated, under the key `keys` —
  # `openssl rand -base64 32` is the whole recipe, and standard or url-safe, padded or not, are
  # all accepted. Rotation is "prepend the new one, drop the old one twelve hours later" and
  # costs nobody a login.
  sessionKeys:
    existingSecret: endpoint-gateway-session-keys
    key: keys
  clientSecret:
    existingSecret: endpoint-gateway-oidc
    key: client-secret

# Extra root certificates for an identity provider behind a private CA. They are trusted **in
# addition to** the built-in public roots, for every outbound HTTPS call the gateway makes
# (discovery, JWKS, token, introspection, the self-origin probe). Name one existing ConfigMap
# *or* Secret holding a PEM bundle under `key`; leave both empty to trust the public roots only.
# A CA certificate is not a secret, so a ConfigMap is the usual home for it.
extraCa:
  configMap: ""
  secret: ""
  key: ca.crt

rbac:
  create: true
serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# The error page a developer meets when the gateway itself is down, so they read "the platform is
# down" rather than a bare 500 — RFC 0009's *Failure mode*.
#
# It deliberately points somewhere **else**: the page is for the case where this gateway is the
# thing that is down, so a middleware pointing at it would serve nothing. Set `service` to
# something that stays up (a static-page deployment, the platform's status page proxy) and the
# chart renders a Traefik `errors` middleware for 5xx only — a 401, a 403 and the framed sign-in
# page are answers the gateway means, and replacing those would hide the messages that make this
# feature usable.
errorPage:
  enabled: true
  service:
    name: ""
    port: 80
  query: "/{status}.html"
