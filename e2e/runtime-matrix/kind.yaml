# A kind cluster for the runtime matrix's cluster tier, `default` runtime class only (kind nodes
# ship containerd with runc and nothing else). The profiles are mounted where Talos writes them,
# so `localhostProfile: profiles/weebo-<name>.json` resolves as it does on weebo-si.
#
#   task runtimes:kind        create it (from the repo root), run the matrix, keep it
#   task runtimes:kind:down   delete it
#
# Same node image as scripts/kind-e2e.yaml. User namespaces are on by default from Kubernetes
# 1.33, so `hostUsers: false` needs no feature gate here. The node still cannot start such a Pod
# until e2e/runtime-matrix/kind-userns.sh has lifted kind's /sys overmounts and product-files hook;
# `task runtimes:kind` and CI run it. Under rootless podman the node itself only has 65536 IDs,
# fewer than the kubelet hands out, and the matrix's preflight says so.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: weebo-runtimes
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    extraMounts:
      - hostPath: deploy/seccomp/profiles
        containerPath: /var/lib/kubelet/seccomp/profiles
        readOnly: true
