[tools]
cocogitto = "latest"
node = "24"
# = rust-toolchain.toml, the Containerfiles and CI; bump together.
rust = "1.98.1"
task = "latest"
gitleaks = "latest"
claude = "latest"
rtk = "latest"

# `task audit`
"aqua:EmbarkStudios/cargo-deny" = "latest"
trivy = "0.74.0"

# `task postmortem` — the dependency supply-chain gate. Pinned to the same
# version the composite action downloads in .github/workflows/postmortem.yaml,
# so the local run and the CI gate are the identical scanner.
"github:mlab-sh/postmortem" = "2.0.0"

# `task ci:lint` — validates the workflow files themselves
actionlint = "latest"

# `task helm:lint` — lints and renders the charts under charts/
helm = "4.3.0" # = CI (helm.yaml, envtest.yaml)

# `task lint` — the RFC tooling in scripts/ runs in the pre-commit hook, so it gets linted
shellcheck = "latest"
# `task docs:schemas` — exports the CRD schemas for docs/generator/ (preinstalled on CI runners)
yq = "latest"
traefik = "latest"
