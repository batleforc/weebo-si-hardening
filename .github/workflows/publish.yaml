name: Publish
# Reusable: push one brick's image to GHCR and sign it. Called only by `release.yaml`, and only
# after every gate for the same commit has passed there (test, envtest, helm, and `brick.yaml`'s
# static-binary assertion + Trivy image/Containerfile scans). Nothing else in this repo pushes an
# image — see docs/ci.md, *Releases*.
#
# Two jobs, so `id-token: write` (the OIDC token cosign's keyless signing exchanges for a
# short-lived Fulcio certificate) exists only in the job that signs, never in the one that runs
# a `docker build` over the repository.
on:
  workflow_call:
    inputs:
      crate:
        description: "Cargo package name, which is also the image name under ghcr.io/<owner>/"
        required: true
        type: string
      path:
        description: "Directory holding the brick's Containerfile, relative to the repo root"
        required: true
        type: string
permissions:
  contents: read

jobs:
  push:
    name: push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # Lowercased once, here, and used for the push *and* the signature: metadata-action
      # lowercases what it pushes, so a raw `github.repository_owner` with capitals would name a
      # different repository than the one the digest lives in.
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          CRATE: ${{ inputs.crate }}
        run: echo "image=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/$CRATE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a `v1.2.3` tag: `1.2.3` (what the charts' appVersion resolves to — the `v` is
      # stripped on both sides), `1.2` as the moving patch-level pointer, and the full commit
      # sha as an immutable cross-reference to the source. No `latest` — an unqualified pull
      # should not silently mean "whatever was released last". Pre-release tags
      # (`v1.2.3-rc.1`) get their exact version only; metadata-action skips `{{major}}.{{minor}}`
      # for them.
      #
      # A package first published via GITHUB_TOKEN defaults to private, and stays that way
      # until someone flips it in the package's own settings — there is no workflow-side knob.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # `cache-from: type=gha` replays the layers `brick.yaml` built and scanned for this same
      # commit a few minutes earlier in the same release run, so what is pushed is what was
      # scanned — the build is deterministic from `--locked` and a digest-pinned base.
      #
      # `sbom: true` and `provenance: mode=max` attach BuildKit's SPDX SBOM and a SLSA
      # provenance attestation to the pushed index, so `docker buildx imagetools inspect
      # --format '{{ json .SBOM }}'` answers "what is in this exact image" without a rebuild.
      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./${{ inputs.path }}/Containerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    name: cosign (keyless)
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # the signature is pushed next to the image, as an OCI artifact
      id-token: write # the OIDC token Fulcio binds the signing certificate to — this job only
    steps:
      # The installer's default cosign release (v3.0.6 for v4.1.2), deliberately not overridden:
      # the installer carries a pinned checksum for its default and verifies the download against
      # it, which a newer `cosign-release` it predates would not get.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, never by tag: a tag can be re-pointed after signing, a digest cannot. The
      # certificate's identity is this workflow file at this tag, which is what a verifier pins:
      #
      #   cosign verify ghcr.io/<owner>/<crate>@sha256:… \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/<owner>/weebo-si-hardening/\.github/workflows/publish\.yaml@refs/tags/v'
      - name: Sign
        env:
          REF: ${{ needs.push.outputs.image }}@${{ needs.push.outputs.digest }}
        run: cosign sign --yes "$REF"
