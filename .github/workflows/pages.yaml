name: Pages
# Publishes the documentation site (site/, RFC 0012) to GitHub Pages: a static export of a
# Fumadocs site on @weebo/operator-docs — the CRD reference, form and IDE generated from the
# chart's CRDs, and the pages pointing at docs/. The repository's Pages source must be set to
# "GitHub Actions" (Settings › Pages) once, by hand. The CRD reference is checked against the
# chart's CRDs first, so a stale page is never published.
on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "charts/weebo-si-operator/crds/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:
permissions:
  contents: read
# One deployment at a time, and never cancel one halfway: a half-published site is worse than
# a late one.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build site/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: The CRD reference is not stale
        run: |
          npm run gen:crds
          git diff --exit-code -- content/docs/crds public/crd-schemas
      # GitHub Pages serves the project under /weebo-si-hardening.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /weebo-si-hardening
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # the OIDC token deploy-pages authenticates with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
