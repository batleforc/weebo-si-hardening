name: Semgrep
on:
  push:
    branches: ["main"]
    paths:
      - "**/*.rs"
      - "scripts/**"
      - ".hooks/**"
      - ".github/workflows/semgrep.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.rs"
      - "scripts/**"
      - ".hooks/**"
      - ".github/workflows/semgrep.yaml"
  schedule:
    - cron: "50 23 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # pipx is preinstalled on GitHub-hosted runners.
      - name: Install Semgrep
        run: pipx install semgrep
      # r/bash covers scripts/ and .hooks/, which are not incidental here: they
      # run in the pre-commit hook and one of them (`rfc-check.sh`) is the thing
      # that decides whether a RFC is well-formed. It is the rule namespace and
      # not a `p/` pack because there is no bash *pack* in the registry —
      # `p/bash` 404s, and a 404 config is a hard error (exit 7), which is what
      # failed this workflow rather than any finding.
      # The report lands in RUNNER_TEMP, not the workspace. A SARIF written next
      # to the sources is itself scanned by the gate pass below — it embeds every
      # rule's regex as metadata, so `p/secrets` matches its own patterns and the
      # gate fails on a finding in the report rather than in the code.
      - name: Semgrep scan (SARIF)
        id: sarif
        run: |
          semgrep scan \
            --config p/rust --config r/bash --config p/secrets \
            --severity ERROR \
            --sarif --output "$RUNNER_TEMP/semgrep.sarif"
      # This step sits *before* the gate, so it needs no `always()` to survive it.
      # The one thing that leaves nothing to upload is the scan above failing
      # outright (a bad `--config`, a network error) — hence the explicit success
      # check rather than `always()`. `hashFiles` cannot be used to probe for the
      # report: it only resolves paths under GITHUB_WORKSPACE.
      - name: Upload SARIF
        if: steps.sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep
      # The gate — non-zero on any ERROR-severity finding. Separate from the run
      # above so the report reaches the Security tab even when the gate trips.
      - name: Semgrep scan (gate)
        run: |
          semgrep scan \
            --config p/rust --config r/bash --config p/secrets \
            --severity ERROR \
            --error
