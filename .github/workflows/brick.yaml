name: Brick
# Reusable: build one brick, scan its image, keep the artifacts.
#
# One caller per brick, each with its own `paths:` filter, rather than one
# workflow that computes what changed. GitHub's path filters are per *workflow*,
# not per job, so the alternative is a change-detection action deciding which
# jobs to skip — which means a third-party action in the trigger path and jobs
# that report "skipped" instead of never running. With two bricks the duplication
# is two twelve-line callers, and "build it if its own code changed" stays a
# native filter rather than a computed one.
#
# Workspace-level changes (Cargo.toml, Cargo.lock) are in *both* callers' filters
# on purpose: a dependency bump changes what every binary links, so both rebuild.
on:
  workflow_call:
    inputs:
      crate:
        description: "Cargo package name, which is also the binary name"
        required: true
        type: string
      path:
        description: "Directory holding the brick, relative to the repo root"
        required: true
        type: string
permissions:
  contents: read

jobs:
  binary:
    name: musl binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # musl, not gnu: RFC 0001 argues the binary has to run in a distroless or
      # scratch final stage, and a dynamically linked build silently cannot.
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ inputs.crate }}-musl

      # That moment arrived: `weebo-si-operator` links rustls, whose only two
      # crypto providers (`ring` and `aws-lc-rs`) both compile C and assembly
      # from a `cc` build script. `preauth-proxy` and `passwd-append` are still
      # pure Rust and do not need this, but the step is cheap and unconditional
      # beats a per-crate `if:` that goes stale the next time a brick grows a
      # dependency.
      #
      # `CC_x86_64_unknown_linux_musl` is not optional: cc-rs guesses the cross
      # compiler is named `x86_64-linux-musl-gcc`, and Ubuntu's `musl-tools`
      # installs the wrapper as `musl-gcc`. Without the override the build fails
      # with `ToolNotFound` even though the compiler is right there on $PATH.
      #
      # This does not weaken the static-linking guarantee the next step asserts:
      # musl-gcc only produces the object files for those C sources, and rustc
      # still links them with its own self-contained musl crt.
      - name: Install the musl C toolchain
        run: sudo apt-get install -y --no-install-recommends musl-tools

      # --locked: the build has to fail on a Cargo.lock that does not match the
      # manifests, rather than quietly resolving something else than what was
      # audited by `dep-audit.yaml` and `postmortem.yaml`.
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: >-
          cargo build --release --locked
          --package ${{ inputs.crate }}
          --target x86_64-unknown-linux-musl

      # The same assertion the Containerfile makes, in the same terms: no
      # PT_INTERP segment. `ldd` is not the test — under musl it prints the
      # loader's name for a static-PIE that self-loads, and under glibc it
      # answers a different question about a musl binary. Worth repeating here
      # because this is the artifact a human downloads, and "it is static" is
      # the only reason it can be copied into an image that has no loader.
      - name: Assert the binary is static
        run: |
          bin="target/x86_64-unknown-linux-musl/release/${{ inputs.crate }}"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::${{ inputs.crate }} is dynamically linked"
            exit 1
          fi

      # CycloneDX of the workspace member, so a crate CVE disclosed *after* this
      # build can be matched against this exact artifact:
      #   trivy sbom sbom-<crate>.cdx.json
      - name: SBOM (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --manifest-path "${{ inputs.path }}/Cargo.toml"
          cp "${{ inputs.path }}/${{ inputs.crate }}.cdx.json" "sbom-${{ inputs.crate }}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.crate }}-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/${{ inputs.crate }}
            sbom-${{ inputs.crate }}.cdx.json
          if-no-files-found: error
          retention-days: 14

  image:
    name: image + Trivy + GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      packages: write # push to ghcr.io — no-op on a fork PR, GitHub forces GITHUB_TOKEN read-only there
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # load, not push: this build is for *scanning*. Pushing happens as a
      # separate step below, once the image has actually passed the gates —
      # never publish something the scan hasn't cleared yet.
      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./${{ inputs.path }}/Containerfile
          load: true
          push: false
          tags: ${{ inputs.crate }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report first, gate second. If the scan itself failed the build, the SARIF
      # upload below would be skipped and the findings would never reach the
      # Security tab — the same report-then-gate shape as `semgrep.yaml`.
      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.crate }}:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # `always()` alone would also run this when the *build* failed, where there
      # is no SARIF to upload — a second red step that says nothing about the
      # real one. Upload only if the scan actually produced a report.
      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          # Distinct per brick, so the two uploads do not supersede each other.
          category: trivy-${{ inputs.crate }}

      - name: Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.crate }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Misconfiguration scan of the Containerfile itself — the same check
      # `task audit` runs locally through `trivy fs --scanners misconfig`.
      - name: Trivy (Containerfile misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.path }}/Containerfile
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Everything above this line is a gate. Reaching here means the image built,
      # Trivy found no HIGH/CRITICAL, and the Containerfile itself passed
      # misconfig scanning — only then is it worth publishing.
      #
      # Not on pull_request: a fork PR's GITHUB_TOKEN is read-only regardless of
      # the `packages: write` above, so the push would just fail — and even for a
      # same-repo PR, a package per commit-under-review is not something anyone
      # needs to pull. Publishing is for main, the daily schedule (today's build
      # against today's base image) and manual dispatch.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha for an exact, immutable reference; the branch name (main) as the
      # moving pointer to "whatever main currently builds". No `latest` — an
      # unqualified pull should not silently mean "main".
      #
      # No tag on visibility here: a package first published via GITHUB_TOKEN
      # defaults to private, and stays that way until someone flips it in the
      # package's own settings — there is no workflow-side knob for it.
      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.crate }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # Rebuilds against the same Containerfile and context this job already
      # scanned, with `cache-from: type=gha` hitting the layers the build step
      # above just populated — this is a cache replay, not a second real build,
      # so what gets pushed is what was scanned.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./${{ inputs.path }}/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
