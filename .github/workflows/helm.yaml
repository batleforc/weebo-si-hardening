name: Helm charts
# Lints and renders every chart under charts/ — the same two commands task helm:lint runs
# locally via the pre-commit hook (task lint). A template execution error (e.g. a `required`
# value with no default) only surfaces from `helm template`, not `helm lint` alone, so both run
# here for both charts and every certificate-provider variant weebo-si-operator's chart supports.
on:
  push:
    branches: ["main"]
    paths:
      - "charts/**"
      - ".tasks/helm.yaml"
      - ".github/workflows/helm.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "charts/**"
      - ".tasks/helm.yaml"
      - ".github/workflows/helm.yaml"
  workflow_dispatch:
  # release.yaml runs this whole workflow as a gate before anything is published.
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    name: lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned, not `latest`: a new Helm release can change lint/template behaviour, and a
          # gate whose tool moves under it can go red (or green) with no commit here.
          # Same version mise.toml resolves locally for `task helm:lint`.
          version: v4.3.0
      - name: weebo-si-operator
        run: |
          helm lint charts/weebo-si-operator
          helm template ci charts/weebo-si-operator --namespace weebo-si-hardening > /dev/null
          helm template ci charts/weebo-si-operator --namespace weebo-si-hardening --set certificates.provider=openshift > /dev/null
          helm template ci charts/weebo-si-operator --namespace weebo-si-hardening --set certificates.provider=none > /dev/null
          # RFC 0009's rules are rendered per dialect, so both shapes are rendered here: a
          # cluster running OpenShift carries `routes` rules and no `ingresses` ones.
          helm template ci charts/weebo-si-operator --namespace weebo-si-hardening --set endpointAuth.rbac.enabled=true > /dev/null
          helm template ci charts/weebo-si-operator --namespace weebo-si-hardening --set endpointAuth.rbac.enabled=true --set endpointAuth.dialect=OpenShiftRoute > /dev/null
          helm template ci charts/weebo-si-operator --namespace weebo-si-hardening --set identity.rbac.enabled=true > /dev/null
      - name: preauth-proxy
        run: |
          # values.schema.json requires credentials.existingSecret; lint with the render's placeholder.
          helm lint charts/preauth-proxy --set credentials.existingSecret=ci-placeholder
          helm template ci charts/preauth-proxy --namespace preauth-proxy --set credentials.existingSecret=ci-placeholder > /dev/null
      - name: endpoint-gateway
        run: |
          helm lint charts/endpoint-gateway
          helm template ci charts/endpoint-gateway --namespace weebo-si-hardening > /dev/null
          # `Observe` is the rollout step an admin actually uses first, so a template error in it
          # would otherwise be found during a rollout rather than in CI.
          helm template ci charts/endpoint-gateway --namespace weebo-si-hardening --set config.enforcement=Observe --set autoscaling.enabled=true > /dev/null
