name: Repo
# The non-Rust half of `task lint`, plus the two checks that only run in an
# editor today. The RFC gate is the one that matters: `docs/rfc/readme.md` says a
# RFC that drops a mandatory section is usually dropping the thinking with it,
# and the generated index is regenerated by the pre-commit hook — so CI is what
# catches a commit pushed with `--no-verify`.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".hooks/**"
      - "readme.md"
      - ".markdownlint.yaml"
      - "cspell.json"
      - ".github/workflows/repo.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".hooks/**"
      - "readme.md"
      - ".markdownlint.yaml"
      - "cspell.json"
      - ".github/workflows/repo.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rfc:
    name: RFC format + index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The script itself, not `task rfc:check`, so CI needs no task runner. It
      # is POSIX sh with no dependencies, which is exactly why it was written
      # that way — it runs in the pre-commit hook where "works on my shell" is
      # not a guarantee anyone gets.
      - name: rfc-check
        run: ./scripts/rfc-check.sh
      # `rfc-check.sh` already fails on a stale index, but it does so with one
      # line of output. Running the generator and diffing says *what* drifted.
      - name: The generated index is not stale
        run: |
          ./scripts/rfc-index.sh
          if ! git diff --exit-code -- docs/rfc/readme.md; then
            echo "::error::docs/rfc/readme.md is stale — run 'task recu'"
            exit 1
          fi

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # shellcheck is preinstalled on GitHub-hosted ubuntu runners.
      # Same two invocations as `task shell:lint`: repo tooling is held to POSIX
      # sh, the git hooks only to warnings.
      - name: scripts/ (POSIX sh)
        run: shellcheck -s sh scripts/*.sh
      - name: .hooks/
        run: shellcheck -S warning .hooks/*.sh

  docs:
    name: markdownlint + cspell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      # Both configs are committed (.markdownlint.yaml, cspell.json) but nothing
      # ran them outside an editor until now, which is how a hard-wrapped table
      # or a French word reaches main.
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "readme.md"
      - name: cspell
        run: >-
          npx --yes cspell@latest lint --no-progress
          "docs/**/*.md" "readme.md" "bins/**/*.rs" "bins/**/Containerfile"
