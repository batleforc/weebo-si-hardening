name: Build weebo-si-operator
# Fires only when this brick's own code moves, or when a workspace-level change means every
# binary links something different — the same rule `build-preauth-proxy.yaml` and
# `build-passwd-append.yaml` use. Unlike those two, this brick is not one crate: its binary links
# every workspace crate `cargo tree -p weebo-si-operator -e normal,build` lists — today every
# `weebo-si-*` crate except `weebo-si-envtest-support` (dev-only, never reaches the release
# binary). The filter used to list 7 of those 14, so a change to e.g. `weebo-si-policy-guard`
# did not rebuild or rescan this image. Re-derive it when a crate is added.
# Build + scan only: publishing happens in release.yaml, after every gate — docs/ci.md *Releases*.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/weebo-si-chassis/**"
      - "crates/weebo-si-controller/**"
      - "crates/weebo-si-crd/**"
      - "crates/weebo-si-dwoc-pin/**"
      - "crates/weebo-si-endpoint-auth/**"
      - "crates/weebo-si-identity/**"
      - "crates/weebo-si-image-policy/**"
      - "crates/weebo-si-kubearmor-policy/**"
      - "crates/weebo-si-network-profiles/**"
      - "crates/weebo-si-operator/**"
      - "crates/weebo-si-policy-guard/**"
      - "crates/weebo-si-registry-config/**"
      - "crates/weebo-si-runtime/**"
      - "crates/weebo-si-webhook/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-weebo-si-operator.yaml"
      - ".github/workflows/brick.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/weebo-si-chassis/**"
      - "crates/weebo-si-controller/**"
      - "crates/weebo-si-crd/**"
      - "crates/weebo-si-dwoc-pin/**"
      - "crates/weebo-si-endpoint-auth/**"
      - "crates/weebo-si-identity/**"
      - "crates/weebo-si-image-policy/**"
      - "crates/weebo-si-kubearmor-policy/**"
      - "crates/weebo-si-network-profiles/**"
      - "crates/weebo-si-operator/**"
      - "crates/weebo-si-policy-guard/**"
      - "crates/weebo-si-registry-config/**"
      - "crates/weebo-si-runtime/**"
      - "crates/weebo-si-webhook/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-weebo-si-operator.yaml"
      - ".github/workflows/brick.yaml"
  # Daily, so a CVE disclosed against the base image or a dependency *after* the last commit
  # still trips CI the next morning. This is the "future CVE" catch, not a build-time snapshot.
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brick:
    name: weebo-si-operator
    uses: ./.github/workflows/brick.yaml
    permissions:
      contents: read
      security-events: write
    with:
      crate: weebo-si-operator
      path: crates/weebo-si-operator
