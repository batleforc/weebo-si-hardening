name: Secret scan
# The pre-commit hook already runs gitleaks over the staged tree. This is the
# backstop for everything that hook cannot see: a commit pushed with
# `--no-verify`, a branch created in the web UI, and the history that predates
# the hook being installed.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still a leak
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_CONFIG: this repo has no gitleaks.toml, so the action's
          # default ruleset applies — which is what `cog`'s pre-commit hook uses
          # locally too. Add one on both sides at once if it ever needs tuning.
          #
          # GitHub *organisation* accounts need a (free) licence key here:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
