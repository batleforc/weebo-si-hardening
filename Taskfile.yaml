version: "3"

includes:
  mise: ./.tasks/mise.yaml
  rust: ./.tasks/rust.yaml
  rfc: ./.tasks/rfc.yaml
  shell: ./.tasks/shell.yaml
  ci: ./.tasks/ci.yaml
  envtest: ./.tasks/envtest.yaml
  crd: ./.tasks/crd.yaml
  helm: ./.tasks/helm.yaml

tasks:
  init:
    desc: "Init folder"
    cmds:
      - mise install
      - cog install-hook -a -o

  recu:
    desc: "Regenerate everything derived from source: the RFC index, and crd.yaml when its schema is staged"
    cmds:
      - task: rfc:index
      - task: crd:gen

  lint:
    desc: "Format, lint and validate the repo (run by the pre-commit hook)"
    cmds:
      - task: rust:fmt
      - task: rust:clippy
      - task: shell:lint
      - task: rfc:check
      - task: crd:check
      - task: helm:lint
      - task: ci:lint

  test:
    desc: "Run the whole test suite"
    cmds:
      - task: rust:test

  build:
    desc: "Build every brick in release mode"
    cmds:
      - task: rust:build

  audit:
    desc: "Check dependencies, container images and Helm charts for known CVEs and misconfiguration"
    cmds:
      - task: rust:audit
      - |
        set -eu
        if ! command -v trivy >/dev/null 2>&1; then
          echo "trivy not installed — run 'mise use trivy' to enable the filesystem scan" >&2
          exit 0
        fi
        # --helm-set: charts/preauth-proxy/values.yaml's `credentials.existingSecret` is
        # required-with-no-default (see values.yaml's own comment) — trivy's Helm renderer needs
        # a value to render the chart at all, or the whole chart is silently skipped rather than
        # scanned. weebo-si-operator has no key by this name, so this is a no-op for it.
        trivy fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL \
          --helm-set credentials.existingSecret=ci-placeholder .

  supply-chain:
    desc: "Dependency supply-chain gate (postmortem) — reputation and vulns, not just advisories"
    cmds:
      # Deliberately not folded into `task audit`: this one goes over the
      # network on every run and anonymous vuln.mlab.sh is capped at 8 scans an
      # hour, so making it part of the audit everyone runs would throttle the
      # audit everyone runs. CI schedules it daily.
      - task: ci:postmortem
